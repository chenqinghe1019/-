sql_templates:

  usage_rule:
    - "使用前先确认当前项目，替换表后缀（41/44/46）、事件名、字段名。"
    - "日期字段以各项目实际表结构为准，写 SQL 前先查一次字段列表。"
    - "模板中 {project_id} 为占位符，需替换为实际项目 ID。"
    - "数数动态日期参数为所有项目通用规则：${PartDate:date} / ${PartDate:date1} 本身会展开为 \"$part_date\" between 'xxxx' and 'xxxx'，不要再手写 \"$part_date\" 拼接。严禁写法：WHERE \"$part_date\"${PartDate:date}、WHERE u.\"$part_date\"${PartDate:date}，会被展开成 \"$part_date\"\"$part_date\" 或 u.\"$part_date\"\"$part_date\" 导致字段无法解析。正确写法：当前子查询作用域保留名为 \"$part_date\" 的字段，然后直接写 WHERE ${PartDate:date}；如确实需要给事件表别名且平台参数支持别名前缀，再写 e.${PartDate:date}，不要写 e.\"$part_date\"${PartDate:date}。"
    - "数数动态日期参数使用错误警示：${PartDate:date1} / ${PartDate:date2} 会展开为对应的 \"$part_date\" between ... 条件；使用它的当前子查询作用域里必须存在名为 \"$part_date\" 的字段。如果当前层已经把日期别名改成 \"新增日期\" 等中文名，再写 WHERE ${PartDate:date1} 会报 Column '$part_date' cannot be resolved。正确做法是内部保留 \"$part_date\" 字段，筛选后最外层再改名展示。"

  templates:

    - name: "新增用户数（按日）"
      description: "统计每日新注册用户数"
      sql: |
        SELECT
          date(create_role_time) AS dt,
          count(distinct #account_id) AS new_users
        FROM ta.v_user_{project_id}
        WHERE date(create_role_time) BETWEEN '{start_date}' AND '{end_date}'
        GROUP BY 1
        ORDER BY 1

    - name: "付费用户数与付费金额（按日）"
      description: "统计每日付费人数和付费总金额"
      sql: |
        SELECT
          date(#event_time) AS dt,
          count(distinct #account_id) AS pay_users,
          sum(payment) AS total_payment
        FROM ta.v_event_{project_id}
        WHERE #event_name = 'pay_log'
          AND pay_result = 1
          AND date(#event_time) BETWEEN '{start_date}' AND '{end_date}'
        GROUP BY 1
        ORDER BY 1

    - name: "次留率"
      description: "统计指定日期新增用户的次日留存率"
      sql: |
        SELECT
          date(u.create_role_time) AS reg_dt,
          count(distinct u.#account_id) AS new_users,
          count(distinct e.#account_id) AS retained_users,
          round(count(distinct e.#account_id) * 1.0 / count(distinct u.#account_id), 4) AS retention_rate
        FROM ta.v_user_{project_id} u
        LEFT JOIN ta.v_event_{project_id} e
          ON u.#account_id = e.#account_id
          AND date(e.#event_time) = date(u.create_role_time) + INTERVAL 1 DAY
          AND e.#event_name = 'in_out_log'
        WHERE date(u.create_role_time) BETWEEN '{start_date}' AND '{end_date}'
        GROUP BY 1
        ORDER BY 1

    - name: "战斗胜率（按关卡）"
      description: "统计各关卡战斗胜率，适用于下方了"
      project: "下方了"
      sql: |
        SELECT
          map_id,
          count(*) AS total_battles,
          sum(case when battle_result = 1 then 1 else 0 end) AS wins,
          round(sum(case when battle_result = 1 then 1 else 0 end) * 1.0 / count(*), 4) AS win_rate
        FROM ta.v_event_{project_id}
        WHERE #event_name = 'battle_result'
          AND date(#event_time) BETWEEN '{start_date}' AND '{end_date}'
        GROUP BY 1
        ORDER BY 1

    - name: "每日R档战力分布（均值/四分位）"
      description: "按日期×累计充值R档，统计当日活跃账号的战力均值与Q1/中位数/Q3。人群=当日活跃且power非空；每人每日战力取当日最后一次power事件值；R档按截至当日累计RMB充值(pay_log payment>0,单位分)分档。不用CTE，嵌套子查询拆解。参考报表 41_4907。"
      project: "下方了"
      sql: |
        SELECT
            CASE WHEN grouping(part_date) = 1 THEN '汇总'
                 ELSE date_format(CAST(part_date AS date), '%Y-%m-%d') END AS "日期",
            CASE WHEN grouping(r_level) = 1 THEN '汇总' ELSE r_level END AS "R级别",
            count(DISTINCT account_id) AS "账号数",
            round(avg(last_power), 0) AS "战力均值",
            round(approx_percentile(last_power, 0.25), 0) AS "战力Q1",
            round(approx_percentile(last_power, 0.5), 0) AS "战力中位数",
            round(approx_percentile(last_power, 0.75), 0) AS "战力Q3"
        FROM (
            SELECT part_date, account_id, last_power,
                CASE
                    WHEN cum_pay = 0 THEN 'a_R0_免费'
                    WHEN cum_pay <= 600    THEN 'b_(0,6]'
                    WHEN cum_pay <= 3000   THEN 'c_(6,30]'
                    WHEN cum_pay <= 10000  THEN 'd_(30,100]'
                    WHEN cum_pay <= 30000  THEN 'e_(100,300]'
                    WHEN cum_pay <= 50000  THEN 'f_(300,500]'
                    WHEN cum_pay <= 100000 THEN 'g_(500,1000]'
                    ELSE 'h_1000+'
                END AS r_level
            FROM (
                SELECT b.part_date, b.account_id,
                       max(b.last_power) AS last_power,
                       COALESCE(sum(p.pay_cents), 0) AS cum_pay
                FROM (
                    SELECT "$part_date" AS part_date, "#account_id" AS account_id,
                           max_by("power", "#event_time") AS last_power
                    FROM ta.v_event_{project_id}
                    WHERE "domain" = 'release' AND "power" IS NOT NULL AND "#account_id" IS NOT NULL
                      AND CAST("$part_date" AS date) BETWEEN date '{start_date}' AND date '{end_date}'
                    GROUP BY "$part_date", "#account_id"
                ) b
                LEFT JOIN (
                    SELECT "#account_id" AS acc, CAST("$part_date" AS date) AS pay_date,
                           CAST("payment" AS double) AS pay_cents
                    FROM ta.v_event_{project_id}
                    WHERE "domain" = 'release' AND "$part_event" = 'pay_log' AND "payment" > 0
                      AND CAST("$part_date" AS date) <= date '{end_date}'
                ) p ON p.acc = b.account_id AND p.pay_date <= CAST(b.part_date AS date)
                GROUP BY b.part_date, b.account_id
            ) acct_day
        ) acct_day_r
        GROUP BY GROUPING SETS ((part_date, r_level), (part_date), (r_level), ())

    - name: "新增第N天 R档战力分布（动态新增日期参数）"
      description: "队列视角：选定新增日期(${PartDate:date1}动态参数)，看该批新增账号在新增第N天(注册当天=第1天,第1~7天)×累计R档下的战力均值与Q1/中位数/Q3。每人每天战力取当日最后一次战力值。战力源二选一：公共属性 power(每事件携带，所有当日活跃账号都有) 或 change_power_log 事件的 after 字段(仅当天有战力变化的账号；41_4914 用此)。若要把新增日期也作为表内维度(而非仅作参数汇总)，把 reg_date 加入最外层 SELECT 与 GROUPING SETS 作前置维度即可(参考报表 41_4914 已含 新增日期×新增第N天×R档)。dynamic param 机制见 ta_dashboard_report_workflow.yaml。参考报表 41_4914。"
      project: "下方了"
      sql: |
        SELECT
            CASE WHEN grouping(day_n) = 1 THEN '汇总'
                 ELSE CONCAT('第', CAST(day_n AS varchar), '天') END AS "新增第N天",
            CASE WHEN grouping(r_level) = 1 THEN '汇总' ELSE r_level END AS "R级别",
            count(DISTINCT account_id) AS "账号数",
            round(avg(last_power), 0) AS "战力均值",
            round(approx_percentile(last_power, 0.25), 0) AS "战力Q1",
            round(approx_percentile(last_power, 0.5), 0) AS "战力中位数",
            round(approx_percentile(last_power, 0.75), 0) AS "战力Q3"
        FROM (
            SELECT day_n, account_id, last_power,
                CASE
                    WHEN cum_pay = 0 THEN 'a_R0_免费'
                    WHEN cum_pay <= 600    THEN 'b_(0,6]'
                    WHEN cum_pay <= 3000   THEN 'c_(6,30]'
                    WHEN cum_pay <= 10000  THEN 'd_(30,100]'
                    WHEN cum_pay <= 30000  THEN 'e_(100,300]'
                    WHEN cum_pay <= 50000  THEN 'f_(300,500]'
                    WHEN cum_pay <= 100000 THEN 'g_(500,1000]'
                    ELSE 'h_1000+'
                END AS r_level
            FROM (
                SELECT lp.day_n, lp.account_id,
                       max(lp.last_power_at_day) AS last_power,
                       COALESCE(sum(p.pay_cents), 0) AS cum_pay
                FROM (
                    SELECT na.account_id, na.reg_date,
                           date_diff('day', na.reg_date, date(e."$part_date")) + 1 AS day_n,
                           max_by(e."power", e."#event_time") AS last_power_at_day
                    FROM (
                        SELECT * FROM (
                            SELECT "#account_id" AS account_id,
                                   date("create_role_time") AS reg_date,
                                   date_format("create_role_time", '%Y-%m-%d') AS "$part_date"
                            FROM ta.v_user_{project_id}
                            WHERE "domain" = 'release' AND "#account_id" IS NOT NULL AND "create_role_time" IS NOT NULL
                        ) na_raw
                        WHERE ${PartDate:date1}
                    ) na
                    JOIN ta.v_event_{project_id} e
                      ON e."#account_id" = na.account_id AND e."domain" = 'release' AND e."power" IS NOT NULL
                     AND date(e."$part_date") BETWEEN na.reg_date AND date_add('day', 6, na.reg_date)
                    GROUP BY na.account_id, na.reg_date, date_diff('day', na.reg_date, date(e."$part_date")) + 1
                ) lp
                LEFT JOIN (
                    SELECT "#account_id" AS acc, date("$part_date") AS pay_date, CAST("payment" AS double) AS pay_cents
                    FROM ta.v_event_{project_id}
                    WHERE "domain" = 'release' AND "$part_event" = 'pay_log' AND "payment" > 0
                ) p ON p.acc = lp.account_id AND p.pay_date <= date_add('day', lp.day_n - 1, lp.reg_date)
                GROUP BY lp.day_n, lp.account_id
            ) acct_dayn
        ) acct_dayn_r
        GROUP BY GROUPING SETS ((day_n, r_level), (day_n), (r_level), ())

    - name: "广告观看率（方块也疯狂）"
      description: "统计各广告位的弹出次数、点击次数和完成次数"
      project: "方块也疯狂"
      sql: |
        SELECT
          ad_location_name,
          ad_location_scene,
          sum(case when action_id = 1 then 1 else 0 end) AS show_cnt,
          sum(case when action_id = 2 then 1 else 0 end) AS click_cnt,
          round(sum(case when action_id = 2 then 1 else 0) * 1.0
            / nullif(sum(case when action_id = 1 then 0 end), 0), 4) AS ctr
        FROM ta.v_event_{project_id}
        WHERE #event_name = 'ad_button'
          AND date(#event_time) BETWEEN '{start_date}' AND '{end_date}'
        GROUP BY 1, 2
        ORDER BY 1, 2
