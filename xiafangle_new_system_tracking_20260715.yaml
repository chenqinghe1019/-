project: 下方了
project_code: xiafangle
project_id: 41
created_at: '2026-07-15'
updated_at: '2026-07-15'
status: proposed
source_design_docs:
  - 孟婆煮汤策划案.docx
  - 公会对决策划案.docx
  - 宝石系统策划案.docx
  - 诡市寻宝策划案.docx
baseline:
  tracking_spec: xiafangle_tracking.yaml
  event_table: ta.v_event_41
  user_table: ta.v_user_41
  domain_release_filter: '"domain" = ''release'''
design_rules:
  - 服务端核心事件以结算完成为上报时机，客户端仅承担页面曝光与页签漏斗。
  - 活动事件统一携带 activity_id、activity_round、activity_day。
  - 一轮或一次投掷使用 round_uid / roll_uid，保证可关联与幂等。
  - 资源消耗、奖励和返还使用结构化 array<object>；空数组传 []，不得拼接字符串。
  - 概率行为必须成功失败均上报；比例按 0-1 原值记录。
  - 专属行为日志与 item_log、money_log、change_power_log 双写并使用固定 change_reason 对账。
  - 所有活动商店购买统一使用 activity_shop_buy_log，不再按玩法前缀新建购买事件。
shared_events:
  - event: activity_shop_buy_log
    name: 活动商店购买
    side: 服务端
    trigger: 任意活动商店商品购买成功，消耗与奖励均完成结算后；每个商品订单上报一次
    required_fields:
      - activity_id
      - activity_round
      - activity_day
      - activity_type
      - order_uid
      - shop_id
      - goods_id
      - goods_name
      - buy_num
      - cost_items
      - award_items
      - daily_buy_times_after
      - activity_buy_times_after
    optional_fields:
      - shop_name
      - discount_rate
      - remain_buy_num_after
      - unlock_progress_before
      - unlock_progress_after
    asset_change_structure:
      fields:
        - item_type
        - item_id
        - item_name
        - num
        - result
      rules:
        - cost_items 和 award_items 均使用 asset_change 数组。
        - item_type 区分货币、背包道具、礼包、碎片及其他资产，避免不同资产表的 item_id 重复。
        - num 统一传正数；由所属数组判断消耗或获得。
        - result 记录本次结算后的剩余数量，用于与 item_log / money_log 对账。
        - 免费商品的 cost_items 传 []。
        - 支持单种、多种以及不同活动专属道具支付。
systems:
  - system: 孟婆煮汤
    events:
      - mengpo_page_log
      - mengpo_boil_log
      - mengpo_collect_log
      - mengpo_repair_log
      - mengpo_idle_collect_log
      - mengpo_reward_log
      - mengpo_rank_settle_log
    key_analysis:
      - 煮汤次数、点数分布与爆锅率
      - 修复使用率与道具消耗
      - 单轮最高点数、极品次数、大奖保底与排行
  - system: 公会对决
    events:
      - guild_duel_page_log
      - guild_duel_match_log
      - guild_duel_merit_log
      - guild_duel_book_log
      - guild_duel_reward_log
      - guild_duel_settle_log
    key_analysis:
      - 参与资格、轮空与匹配强弱
      - 任务功绩、功绩薄加成与研究加成
      - 每日/最终胜负、对决积分与隐藏分
  - system: 宝石系统
    events:
      - gem_log
      - gem_equip_log
      - gem_upgrade_log
      - gem_advance_log
      - gem_inherit_log
      - gem_reset_log
    key_analysis:
      - 宝石产销、随机阶级属性与数值品质
      - 镶嵌、等级交换、强化消耗与返还
      - 升阶真实成功率、失败损耗、继承与战力收益
  - system: 诡市寻宝
    events:
      - guishi_page_log
      - guishi_dice_log
      - guishi_grid_log
      - activity_shop_buy_log
      - guishi_reward_log
      - guishi_clear_log
    key_analysis:
      - 骰子产销、点数分布、圈数与移动步数
      - 格位经验、升品、英雄事件与奖励
      - 通用活动商店消费、奖励领取、剩余资源折算
reuse_existing_events:
  - pay_log
  - item_log
  - money_log
  - mission_finish_log
  - mission_reward_log
  - change_power_log
  - mail_log
open_questions:
  - 孟婆煮汤品质规则同时写有 13-21 稀有与 21-24 极品，21点归属需策划确认。
  - 诡市银骰子规则正文为排除3点后从剩余点随机，界面文案写在排除点数里随机，需策划确认。
  - 需分配宝石系统 change_reason、change_power_log.change_reason 以及各活动 task_type/target_type 枚举。
  - 需冻结 activity_type 枚举及活动商店 item_log / money_log 的 change_reason。
