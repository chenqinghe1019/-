project:
  name: "步步项目 / 一步两步"
  table_suffix: 22
  user_table: "ta.v_user_22"
  event_table: "ta.v_event_22"
  created_at: "2026-08-04"

dashboard:
  name: "大R转端监控"
  grain: "每个nb_open_id一行，角色字段取最近活跃角色"
  population:
    user_key: "nb_open_id"
    whale_rule: "同一nb_open_id下全角色成功人民币充值累计>=100000元"
    payment_unit: "pay_log.payment为分，统计时除以100"
    successful_payment_filter:
      - "$part_event = 'pay_log'"
      - "domain = 'release'"
      - "change_reason = 1"
      - "pay_result = 1"
      - "payment > 0"
  transfer:
    source_event: "log_in_out"
    package_field: "code_id"
    identity_field: "nb_open_id"
    rule: "同一nb_open_id历史登录出现至少2个非空code_id，即判定为曾转端"
    original_package: "首次登录的非空code_id"
    current_package: "最近一次登录的非空code_id"
    statuses:
      - "未转端：历史仅1个包体"
      - "已转端-当前在新包：历史至少2个包体，当前包体不等于原始包体"
      - "已转端-已回原包：历史至少2个包体，当前包体等于原始包体"
    note: "转端以包体code_id识别，不再用channel_id跨渠道变化替代；不硬编码端包ID映射"
  recent_30_days:
    window: "含今天的最近30个自然日，即current_date-29至current_date"
  payment_metrics:
    role_lifetime_payment: "最近活跃角色#account_id的全历史成功付费"
    openid_lifetime_payment: "同一nb_open_id全部角色的全历史成功付费"
    current_package_lifetime_payment: "同一nb_open_id在最近登录code_id下的全历史成功付费"
    recent_30d_payment: "同一nb_open_id最近30日全部包体成功付费金额、次数、付费天数"
    current_package_recent_30d_payment: "同一nb_open_id最近30日在最近登录code_id下成功付费金额、次数、付费天数"
  base_fields:
    - "nick_name"
    - "season"
    - "距今流失天数"
    - "#account_id"
    - "region_id"
    - "角色累充"
    - "openid累充"
    - "最后付费时间"
    - "最后登出时间"
    - "当前端包历史付费金额"
    - "近30天付费金额/次数/天数"
    - "近30天当前端包付费金额/次数/天数"
    - "原始登录包体"
    - "近一次登录包体"
    - "近一次登录系统"
    - "近一次登录渠道"
    - "转端状态"
    - "历史登录包体数"

data_quality:
  - "登录事件code_id为空的记录不参与包体识别"
  - "若早期登录没有code_id，原始包体只能追溯到第一条code_id非空的登录"
  - "看板保留全部10万+用户并输出转端状态，不能只保留已转端用户，否则无法计算大R转端率"
