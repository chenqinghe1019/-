project: 下方了
project_code: xiafangle
project_id: 41
created_at: '2026-08-04'
updated_at: '2026-08-05'
status: revised
purpose: 大超R角色流失监控预警基础宽表
tables:
  user_table: ta.v_user_41
  event_table: ta.v_event_41
filters:
  domain: release
  role_historical_payment:
    source: ta.v_user_41.total_payment
    unit_in_source: 分
    display_unit: 元
    conversion: total_payment / 100.0
    dynamic_parameter: '${Number:number1}'
    note: 使用数数“数字表达式”动态参数，可配置区间、大于或大于等于阈值
  date_filter:
    enabled: false
    note: 2026-08-04按用户要求取消日期筛选，仅保留角色历史累充金额筛选
time_axis:
  anchor: last_active_date
  last_active_source: in_out_log
  anchor_rule: 按角色全历史in_out_log取max($part_date)，不应用日期筛选
  join_rule: 大超R角色与最后活跃锚点使用inner join，不保留没有锚点的空行
  daily_activity_columns:
    - 最后活跃日
    - 最后活跃日前1日
    - 最后活跃日前2日
  state_columns:
    - 最后活跃日
    - 最后活跃日前1日
    - 最后活跃日前2日
    - 最后活跃日前3日
  metric_history_rule: 行为和状态明细独立扫描至玩家最后活跃日，避免被日期参数截断
online_time:
  event: ta_mg_hide
  field: '#duration'
  source_unit: 秒
  display_unit: 分钟
  aggregation: 玩家自然日有效时长求和后除以60
  valid_duration_rule: try_cast("#duration" as double) > 0 and try_cast("#duration" as double) < 86400
  activity_event: in_out_log
  deprecated_source: in_out_log.online_time
activity_metrics:
  - event: boss_battle_report
    display_name: 部落BOSS参与次数
    daily_count_rule: count(distinct battle_uid)
    trigger: 战斗结束
  - event: pvp_log
    display_name: PVP参与次数
    daily_count_rule: count(distinct battle_uid)
    note: 当前统计全部pvp_log；事件同时可能被常规PVP和劫镖PVP复用
  - event: mining_log
    display_name: 矿脉争夺参与次数
    daily_count_rule: count(event rows)
    trigger: 矿脉战斗结束
    data_quality_warning: 2026-08-04导出样本中2026-08-01有75人发生，2026-08-02与2026-08-03均为0，需核查事件停报或更名
  - event: post_office_escort_log
    display_name: 诡都邮局押镖参与次数
    daily_count_rule: count(distinct escort_uid)
    note: 事件在押镖开始和领奖均可能上报，按escort_uid去重
state_metrics:
  mainline:
    events:
      - battle_star
      - battle_result
    battle_type: 1
    rule: 截至目标自然日的历史最大map_id
  island:
    events:
      - battle_star
      - battle_result
    battle_type: 3
    rule: 截至目标自然日的历史最大map_id
  power:
    event: change_power_log
    field: after
    rule: max_by(after, "#event_time")，取截至目标自然日的最后已知战力
    null_rule: 全历史无记录时保留null，不伪造为0
resource_balance:
  events:
    - money_log
    - item_log
  rule: max_by(item_result, "#event_time")，取截至最后活跃日的最后已知存量
  null_rule: 全历史无对应资源记录时保留null，不伪造为0
  item_ids:
    diamond: 1
    energy_drink: 3
    advanced_fortune: 1000006
    iron: 1000103
  excluded_item_ids:
    talent_stone: 24
  exclusion_note: 2026-08-04按用户要求从大超R流失监控SQL中移除天赋石存量
warning_design:
  current_stage: 固定阈值加权风险评分已写入监控SQL
  output_fields:
    - 行为流失风险分
    - 行为风险等级
    - 综合预警等级
    - 当前状态
    - 评分适用性
    - 主要风险原因
  leading_judgement_fields:
    - 综合预警等级
    - 行为风险等级
    - 当前状态
    - 评分适用性
    - 主要风险原因
  output_order_rule: 判断结果类字段统一置于玩家及指标明细字段之前
  next_step: 按日保存预警快照，并使用未来7日实际留存结果持续回测阈值


risk_analysis_20260804:
  source_rows: 300
  analyzed_at: '2026-08-04'
  revision: 流失天数>=1重新分析版
  outcome_definition:
    active: 流失天数=0
    churned: 流失天数>=1
    gray_zone: none
    operational_note: 已流失玩家不再进入高中低风险预警，直接显示“已流失”
  training_cohort:
    last_active_date_from: '2026-07-01'
    require_role_age_days: '>=4'
    rows: 192
    active_rows: 103
    churned_rows: 89
    note: 只用近期同口径样本，降低旧服、版本和玩法上线批次偏差
  feature_window:
    rule: 风险评分仅使用最后活跃日前1日至前3日的完整自然日行为；成长指标使用最后活跃日相对前3日的变化
    exclude_d0_behavior_reason: 当前活跃玩家最后活跃日可能是未结束自然日
  scoring:
    operational_method: 10项指标使用固定阈值；命中风险条件时累加固定分值，权重合计100分
    fixed_threshold_reason: 避免看板调整历史累充筛选后，玩家分数随筛选人群漂移
    cross_validated_auc: 0.8168
    logistic_benchmark_cross_validated_auc: 0.7961
    low_to_medium_score: 23.67
    medium_to_high_score: 71.81
    cross_validated_tier_result:
      high_risk:
        rows: 64
        churned_rows: 48
        churn_rate: 0.7500
      medium_risk:
        rows: 64
        churned_rows: 33
        churn_rate: 0.5156
      low_risk:
        rows: 64
        churned_rows: 8
        churn_rate: 0.1250
    display_rule:
      churn_days_ge_1: 已流失
      churn_days_eq_0_and_role_age_under_4d: 待观察
      churn_days_eq_0_and_score_ge_71_81: 高风险
      churn_days_eq_0_and_score_ge_23_67_lt_71_81: 中风险
      churn_days_eq_0_and_score_lt_23_67: 低风险
  score_features:
    - metric: 近2日平均玩法覆盖数
      weight: 0.125028
      recent_auc: 0.803862
      watch_threshold: '<=3'
    - metric: 近2日PVP平均次数
      weight: 0.124355
      recent_auc: 0.802225
      watch_threshold: '<=8.5'
    - metric: 近3日合作试炼平均次数
      weight: 0.114278
      recent_auc: 0.777735
      watch_threshold: '<=0.67'
    - metric: 近3日平均在线分钟
      weight: 0.103640
      recent_auc: 0.751882
      watch_threshold: '<=67.89'
    - metric: 海岛近3日推进
      weight: 0.097513
      recent_auc: 0.739351
      watch_threshold: '<=4'
    - metric: 主线近3日推进
      weight: 0.094641
      recent_auc: 0.730010
      watch_threshold: '<=11'
    - metric: 近2日押镖平均次数
      weight: 0.093361
      recent_auc: 0.726901
      watch_threshold: '<=4.5'
    - metric: 近2日BOSS平均次数
      weight: 0.087414
      recent_auc: 0.712447
      watch_threshold: '<=1.5'
    - metric: 战力近3日增长率
      weight: 0.080457
      recent_auc: 0.695538
      watch_threshold: '<=0.09'
    - metric: 近3日充值天数
      weight: 0.079312
      recent_auc: 0.692757
      watch_threshold: '<=0'
  excluded_from_score:
    - metric: 矿脉争夺
      reason: 前2日有参与记录覆盖率仅15%，且可能受玩法上线或停报影响
    - metric: 天赋石存量
      reason: 本次CSV整列为空且已从监控SQL移除
    - metric: 角色年龄、历史累充、绝对战力与绝对进度
      reason: 易反映批次或阶段差异，仅作辅助
    - metric: 流失天数、最后活跃日期
      reason: 结果字段，禁止用于行为风险评分
  limited_history:
    count: 17
    rule: 角色年龄不足4日的活跃玩家标记为待观察，不用创角前日期的0值进行评分
  current_snapshot:
    active_players: 109
    churned_players: 191
    active_high_risk: 14
    active_medium_risk: 28
    active_low_risk: 61
    active_limited_history_watch: 6
  interpretation: 当前为相关性预警，不代表因果；后续应按日保存快照，并用次日是否回流持续校准阈值
