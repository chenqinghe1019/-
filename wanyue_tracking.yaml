    - {name: 'server_open_time', display: '开服时间', type: 'timestamp', update: 'user_setOnce', source: '服务端'}
    - {name: 'clan_uid', display: '部落ID', type: 'double', update: 'user_set', source: '服务端'}
    - {name: 'domain', display: '环境', type: 'varchar', update: 'user_setOnce', source: '服务端'}
    - {name: 'system', display: '应用（ios/安卓）', type: 'varchar', update: 'user_setOnce', source: '服务端'}
    - {name: 'create_role_time', display: '创角时间', type: 'timestamp', update: 'user_setOnce', source: '服务端'}
    - {name: 'latest_login_time', display: '最后登录时间', type: 'timestamp', update: 'user_set', source: '服务端'}
    - {name: 'latest_online_time', display: '最后登出时间', type: 'timestamp', update: 'user_set', source: '服务端'}
