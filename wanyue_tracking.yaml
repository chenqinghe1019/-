project:
  name: '弯月勇者'
  code: 'wanyue'
  table_suffix: 44
  user_table: 'ta.v_user_44'
  event_table: 'ta.v_event_44'
  source:
    file: '弯月勇者-埋点说明文档 (1).xlsx'
    imported_at: '2026-08-11'
    raw_excel_committed: false
    sheets:
      events: '#事件数据!A1:K230'
      user_properties: '#用户属性!A1:H51'
      common_event_properties: '#公共事件属性!A1:D21'
      user_id_system: '#用户ID体系!A1:E5'
      anti_cheat: '外挂防治!A1:J28'
      ios_payment: '发行ios支付渠道需求!A1:J20'
  query_basics:
    release_filter: '"domain" = ''release'''
    role_id: '#account_id'
    aggregate_open_id: 'nb_open_id'
    media_field: 'ad_platform'
    region_field: 'region_id'
    create_role_time_type: 'timestamp'
    active_event: 'in_out_log'
    online_duration: 'in_out_log.online_time, seconds'
    payment: 'pay_log.payment; source document does not state yuan/fen, do not assume unit'
    battle_start_event: 'battle_star'
    battle_result_event: 'battle_result'
    battle_level_field: 'map_id'
    power_field: 'fighting_power'
  summary:
    event_count: 45
    event_property_count: 224
    user_property_count: 41
    common_event_property_count: 13
  critical_notes:
    - 'v44 is 弯月勇者; v46 is 方块也疯狂. Never mix them.'
    - 'Keep source spellings battle_star and rougue_skill_show unless online schema proves otherwise.'
    - 'region_id type conflict: user property=varchar; common event property=double. Confirm online type before SQL/casting.'
    - 'clan_uid type conflict: user property=double; common event property=varchar. Confirm online type before SQL/casting.'
    - 'boss_battle_result.battle_value conflict: main event sheet=double; anti-cheat sheet=varchar.'
    - 'total_pay_amount=历史累计充值金额（纯RMB充值）; total_payment=历史累计消费（含代金券，实际消费）.'
    - 'ThinkingData property type is fixed by first ingestion; same property name with different planned types must be resolved before implementation.'
  common_event_properties:
    - {name: '#user_id', display: '用户在系统中的唯一用户标识', type: 'bigint'}
    - {name: '#distinct_id', display: '访客ID', type: 'varchar', description: '同设备ID'}
    - {name: '#account_id', display: '角色ID', type: 'varchar'}
    - {name: 'nb_open_id', display: '聚合openID', type: 'varchar', description: '星云聚合openid【项目唯一标识】'}
    - {name: 'open_id', display: '微信open_id', type: 'varchar', description: '微信登录验证成功时记录'}
    - {name: 'create_role_time', display: '创角时间', type: 'timestamp'}
    - {name: 'server_open_time', display: '开服时间', type: 'timestamp'}
    - {name: 'total_payment', display: '历史累计充值金额', type: 'double', description: '行为发生时历史累充金额'}
    - {name: 'domain', display: '测试服或正式服', type: 'varchar', description: 'dev代表测试服，release代表正式服'}
    - {name: 'region_id', display: '区服ID', type: 'double', description: '区服ID'}
    - {name: 'clan_uid', display: '部落ID', type: 'varchar', description: '玩家部落id'}
    - {name: 'fighting_power', display: '战力', type: 'double', description: '发生行为时的战力'}
    - {name: 'channel_id', display: '渠道ID', type: 'double', description: '星云channel_id'}
  user_properties:
    - {name: '#user_id', display: '用户在系统中的唯一用户标识', type: 'bigint', update: 'user_setOnce', source: '数数预设字段'}
    - {name: '#distinct_id', display: '访客ID', type: 'varchar', update: 'user_setOnce', source: '数数预设字段'}
    - {name: '#account_id', display: '账号ID（角色id）', type: 'varchar', update: 'user_setOnce', source: '服务端'}
    - {name: '#active_time', display: '激活时间', type: 'timestamp', update: 'user_setOnce', source: '数数预设字段'}
    - {name: '#reg_time', display: '注册时间', type: 'timestamp', update: 'user_setOnce', source: '数数预设字段'}
    - {name: 'open_id', display: '渠道账号id', type: 'varchar', update: 'user_setOnce', source: '客户端'}
    - {name: 'nb_open_id', display: '聚合openID', type: 'varchar', update: 'user_setOnce', source: '服务端'}
    - {name: 'channel_id', display: '渠道ID', type: 'double', update: 'user_setOnce', source: '服务端'}
    - {name: 'code_id', display: '包体ID', type: 'varchar', update: 'user_setOnce', source: '服务端'}
    - {name: 'region_id', display: '服务器id', type: 'varchar', update: 'user_setOnce', source: '服务端'}
