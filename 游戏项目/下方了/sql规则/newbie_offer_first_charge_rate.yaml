project: 下方了
project_id: 41
updated_at: '2026-08-17'
name: 新人特惠6元首充付费率
status: active

rules:
  denominator:
    name: 1-3结算玩家
    definition: 新增首日触发 battle_result 且 map_id = 3 的 nb_open_id 去重人数。
  numerator:
    name: 1-3后且未进入2-1时购买新人特惠6元玩家
    definition: 分母玩家中，新增首日购买 product_name = '新人特惠6元'，购买前最近一次主线 battle_result 的 map_id = 3，且购买前不存在 map_id = 4 的 battle_star 或 battle_result 的 nb_open_id 去重人数。
    pay_event: pay_log
    product_name: 新人特惠6元
    amount_filter: payment > 0
    purchase_rule: 取玩家首笔 product_name = '新人特惠6元' 的购买时间
    mainline_result_event: battle_result
    mainline_filter: battle_type = 1
    last_level_logic: 在所有早于购买时间的主线 battle_result 中，按 #event_time 倒序取最近一条；其 map_id = 3 时满足第一层条件
    not_enter_2_1_logic: 购买前不得存在 map_id = 4 的 battle_star，也不得存在 map_id = 4 的 battle_result
    enter_2_1_definition: 触发 battle_star 且 map_id = 4 即视为已经进入2-1
  metric:
    name: 新人特惠6元首充付费率
    formula: 购买前最后主线结算为1-3且购买前未触发2-1开始/结算的新人特惠6元购买玩家 / 1-3结算玩家
    output_precision: 4

notes:
  - 统计口径按 nb_open_id 去重，不按 account_id。
  - 仅统计新增首日购买行为。
  - “尚未进入2-1”包含对 battle_star 的判断：只要购买前出现 map_id = 4 的 battle_star，就已经进入2-1，必须从分子剔除。
  - 仅判断“购买前最后一次 battle_result = 1-3”还不够，因为玩家可能已经触发2-1 battle_star但尚未结算，此时最近 battle_result 仍会停留在1-3。
  - 因此 SQL 需要同时满足：购买前最后主线 battle_result = 1-3；购买前不存在2-1 battle_star；购买前不存在2-1 battle_result。
