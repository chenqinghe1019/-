project: 下方了
project_id: 41
updated_at: '2026-08-18'
name: 活动商店分析模板
status: active
source: 2026-07-24 活动分析SQL（File Library: 粘贴的文本 (1).txt）

rules:
  activity_window:
    old_parameter: '${PartDate:date}'
    active_period_parameter: '${PartDate:date2}'
    activity_day_filter: '${Selector:selector2}'
    definition: 新版活动分析统一按自然日活跃周期筛选，不再按玩家创角日期筛选。玩家需在${PartDate:date2}内存在in_out_log，且该活跃日对应开服天数满足${Selector:selector2}，才进入分析人群。
    mature_cycle_rule: 仅保留完整活动周期全部落在${PartDate:date2}统计周期内的区服。活动开始日必须>=统计周期开始日，活动最后一天必须<=统计周期结束日；活动周期只覆盖统计周期的一部分时整服剔除。
    mature_cycle_example: selector2=between 35 and 40时，开服第35~40天必须全部落在所选统计周期内，缺任意一天均不纳入。
    behavior_scope: 任务参与、活动礼包付费、兑换商店购买等活动行为均限制在${PartDate:date2}自然日范围内，同时必须处于玩家所在区服的完整活动开服天数窗口。
    active_user_rule: 通过成熟区服筛选后，玩家还必须在该区服真实活动周期内存在in_out_log才计入活动活跃样本。
    vip_cutoff: VIP分层仍取玩家所在区服真实活动开始时间之前的历史最大vip_change_log.after，不以活跃周期第一天作为VIP截止点。

  payment_segment:
    name: 活动开启前付费分层
    definition: 玩家截至活动开启日前的历史累计付费金额分层；活动开启日及活动期间充值不计入分层，活动期间层级固定。
    amount_unit: 元
    payment_source: ta.v_event_41.pay_log
    amount_logic: 优先使用商品映射表金额，否则使用 payment / 100
    product_filter: 不限制活动商品，统计玩家活动开启前全部历史付费
    free_rule: 历史累计付费 <= 0 为 a_free
    thresholds:
      - a_free: 0
      - b_(0,6]: 0 < pay <= 6
      - c_(6,30]: 6 < pay <= 30
      - d_(30,100]: 30 < pay <= 100
      - e_(100,300]: 100 < pay <= 300
      - f_(300,500]: 300 < pay <= 500
      - g_(500,1000]: 500 < pay <= 1000
      - h_1000+: pay > 1000
    dynamic_selector: false

  activity_shop:
    event: shop_buy_log
    filters:
      - '${PartDate:date2}'
      - '${Selector:selector2}'
      - 'shop_id ${Selector:selector4}'
    dimensions:
      - 活动付费分层或活动开始前VIP分层
      - shop_id
      - goods_id
      - 商品名称
      - 消耗资源ID
    metrics:
      - 购买数量
      - 购买人数
      - 分层内总购买人数
      - 购买人数占比
      - 人均购买数量
      - 消耗资源数量
      - 消耗资源占比

  activity_payment_segment_shop:
    name: 活动付费分层-兑换商店购买分析
    sql_template: 游戏项目/下方了/sql模板/activity_payment_segment_shop_analysis.sql
    active_period_filter: '${PartDate:date2}'
    active_period_definition: 取自然日统计区间内、且所属区服完整活动周期已经成熟的活动期活跃玩家；不再使用create_role_time筛选玩家。
    activity_day_filter: '${Selector:selector2}'
    activity_day_example: 'between 35 and 40'
    activity_product_type_filter: '${Selector:selector1}'
    shop_id_filter: '${Selector:selector4}'
    shop_id_examples:
      - '= 1001'
      - 'in (1001,1002)'
    activity_payment_amount: '(payment + token_payment) / 100，且 payment > 0 OR token_payment > 0'
    payment_segment_thresholds:
      - a_(0,12]: 0 < pay <= 12
      - b_(12,30]: 12 < pay <= 30
      - c_(30,68]: 30 < pay <= 68
      - d_(68,196]: 68 < pay <= 196
      - e_(196,328]: 196 < pay <= 328
      - f_(328,648]: 328 < pay <= 648
      - g_(648,1000]: 648 < pay <= 1000
      - h_(1000,3000]: 1000 < pay <= 3000
      - i_(3000,10000]: 3000 < pay <= 10000
      - j_(10000,+): pay > 10000
    shop_event: shop_buy_log
    shop_fields:
      shop_id: 商店ID
      goods_id: 商品ID
      num: 购买数量
      res_id: 消耗资源ID
      res_num: 本次消耗资源数量
      res_count: 结算后资源剩余数量，不用于消耗统计
    grouping:
      - 活动付费分层
      - res_id
    metrics:
      purchase_quantity: sum(num)
      buyer_count: 购买该res_id的去重玩家数
      buyer_rate_in_segment: 购买人数 / 该活动付费分层总人数
      avg_purchase_count: 购买数量 / 购买人数
      resource_cost: sum(res_num)
      resource_cost_share: 同一res_id下该付费分层消耗数量 / 该res_id所有付费分层总消耗数量
    performance:
      - 先使用${PartDate:date2}确定统计周期开始/结束日期。
      - 根据server_open_time与${Selector:selector2}推导每个区服真实活动开始日和结束日。
      - 仅保留完整活动周期完全落入统计周期的成熟区服，避免未成熟活动数据污染对比。
      - 再使用${PartDate:date2}的in_out_log选出成熟区服中的活动期活跃玩家。
      - 活动付费、任务、礼包购买、shop_buy_log等行为继续使用${PartDate:date2}做事件分区裁剪，并限制在真实活动窗口内。
      - 商店分析先聚合到玩家×res_id，再做最终汇总，减少count(distinct)开销。

notes:
  - 数数动态日期参数必须作为完整 WHERE 条件使用，不写 e.${PartDate:date2} 这类拼接形式。
  - ${PartDate:date2}自2026-08-18起统一表示活动自然日统计/活跃周期，不再表示玩家创角日期。
  - 新增成熟口径：若某区服根据server_open_time推导的完整活动周期没有全部落在所选${PartDate:date2}统计周期内，则该区服全部剔除。
  - 旧版“活动开启前付费分层商店分析”与新版“活动付费分层商店分析”是两套不同口径，不混用。
  - 新版活动付费分层只包含指定activity product_type_two下完整活动期间累计付费金额>0的成熟区服活动玩家。
  - shop_buy_log字段已确认：shop_id, goods_id, num, res_id, res_num, res_count, discount, items。
