property_updates:
  - property: zone_id
    chinese_name: 战区ID
    user_property_type: varchar
    common_event_property_type: double
    note: 工作簿中用户属性与公共事件属性类型不一致，查询时按对应表实际类型处理。
behavior_updates:
  - pay_log 新增 token_payment（double，代金支付金额；说明为代金券数量*100）。
  - battle_star 合作试炼扩展增加 host_id、opponent_id、opponent_battle_array。
  - battle_result 基础口径保留 battle_result（0失败/1胜利/2跳关）；合作试炼扩展增加 host_id、opponent_id、opponent_battle_array、round、result。
  - shop_flush_log / shop_buy_log 增加 activity_name、activity_id，用于活动商店复用。
  - gumu_log 扩展为古墓房间事件，增加 activity_id、start_time、change_reason、room_type、battle_uid、choice_id、wall_hp_after、result。
  - activity_rank_log 显式增加 #account_id（varchar，玩家id）。
  - rename_log 按玩家改名成功上报；#account_id 为公共事件属性，默认随事件存在。
data_quality_warnings:
  - region_group_log 在主事件表重复定义两次；一份显式包含 #account_id（显示名=服务器ID、类型=double），另一份仅 region_id/group_type/group_id。
  - 公共事件属性 #account_id 的正式类型为 varchar；不能用 region_group_log 专项行中的 double 改变全局类型。
  - battle_star、battle_result、shop_flush_log、shop_buy_log、pvp_log、gumu_log、region_group_log 存在重复/扩展定义，知识层按同名事件取字段并集。
