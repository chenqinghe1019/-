notes:
  - "后续步步活动效果分析默认按活动名称、活动期数、活动周期分组。"
  - "本轮活动效果分析统一限制事件 channel_id = 2，活跃、总体付费、活动付费使用同一渠道口径。"
  - "活动周期按自然日闭区间统计，起止日期均包含。"
  - "授权/代言整体时间用于校验活动是否处于有效合作期，不等同于单期活动统计周期。"
  - "第一步效果指标统一使用活动周期内符合参与开服天数门槛的活跃玩家作为总体人群。"
  - "活动付费指标以 ta_ext.temp_use1_22 商品配置为准，good_id 对应 pay_log.product_id；活动流水按 price 统计；活动付费人数及活动流水均要求 price > 0。"
