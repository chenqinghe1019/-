project: "步步项目 / 一步两步"
analysis_usage:
  purpose: "活动效果分析"
  default_group_dimensions:
    - "活动名称"
    - "活动期数"
    - "活动周期"
  activity_period_format: "YYYY-MM-DD~YYYY-MM-DD"
  active_event: "log_in_out"
  payment_event: "pay_log"
  payment_unit: "分，统计金额时 /100 转元"
  server_day_definition: "date_diff('day', date(server_open_time), event_date) + 1"
  participation_rules:
    default: "开服天数 >= 7"
    monthly_activity: "开服天数 > 0"
  first_step_metrics:
    - "活跃玩家数"
    - "付费玩家数（活动周期内有 pay_log 即算）"
    - "总体付费金额"
    - "总体付费率 = 付费玩家数 / 活跃玩家数"
    - "总体ARPU = 总体付费金额 / 活跃玩家数"
    - "总体ARPPU = 总体付费金额 / 付费玩家数"

