project: "步步项目 / 一步两步"
analysis_usage:
  purpose: "活动效果分析"
  default_group_dimensions:
    - "活动名称"
    - "活动期数"
    - "活动周期"
  activity_period_format: "YYYY-MM-DD~YYYY-MM-DD"
  channel_filter: "v_event_22.channel_id = 2"
  active_event: "log_in_out"
  payment_event: "pay_log"
  payment_unit: "分，统计金额时 /100 转元"
  server_open_source:
    table: "user_result_cluster_22"
    cluster_name: "server_open_day_tag"
    join_key: "#double_id -> v_event_22.region_id"
    value_field: "tag_value_tm"
    note: "活动分析开服时间不再优先依赖 v_user_22.server_open_time，因为用户表开服时间不全；server_open_day_tag 的 #double_id 按区服ID关联事件 region_id。"
  server_day_definition: "date_diff('day', date(tag_value_tm), event_date) + 1"
  participation_rules:
    default: "开服天数 >= 7"
    monthly_activity: "开服天数 > 0"
  activity_goods_source:
    table: "ta_ext.temp_use1_22"
    fields:
      - "good_id"
      - "activity_type"
      - "store_type"
      - "good_name"
      - "price"
    payment_join: "pay_log.product_id = temp_use1_22.good_id"
    activity_match: "temp_use1_22.activity_type 对应活动名称"
    revenue_field: "temp_use1_22.price"
    payer_rule: "活动付费人数仅统计命中对应活动商品且 temp_use1_22.price > 0 的 pay_log 玩家"
    note: "活动付费人数通过活动周期内、满足参与开服天数门槛、product_id 命中对应 activity_type 商品配置且 price > 0 的 pay_log 识别；活动付费金额不取 pay_log.payment，统一按每笔命中购买对应的 temp_use1_22.price 累计，且仅统计 price > 0。"
  first_step_metrics:
    - "活跃玩家数"
    - "付费玩家数（活动周期内有 pay_log 即算）"
    - "总体付费金额"
    - "总体付费率 = 付费玩家数 / 活跃玩家数"
    - "总体ARPU = 总体付费金额 / 活跃玩家数"
    - "总体ARPPU = 总体付费金额 / 付费玩家数"
    - "活动付费金额（按 temp_use1_22.price 累计，仅 price > 0）"
    - "活动付费人数（仅 price > 0）"
    - "活动付费率 = 活动付费人数 / 活跃玩家数"
    - "活动ARPU = 活动付费金额 / 活跃玩家数"
    - "活动ARPPU = 活动付费金额 / 活动付费人数"

