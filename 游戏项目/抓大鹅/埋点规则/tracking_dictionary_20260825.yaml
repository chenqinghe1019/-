project: 抓大鹅
updated_at: '2026-08-25'
source: 2026-08-25 数数原始事件样本 CSV
status: proposal

naming_rules:
  - 事件名、属性名以字母开头，仅使用字母、数字、下划线
  - 同义属性跨事件复用同一属性名
  - game_channel 作为公共事件属性
  - 数数 SDK 自动事件保留原名，不重复造系统属性

battle_rule:
  - 对局只保留 battle_start 与 battle_result
  - 使用 battle_uid 串联同一局开始与结算
  - 对局过程行为不拆独立事件，统一在 battle_result 聚合
  - 原 level_result 改为 battle_result
  - 原 star_1 / star_2 合并为 battle_result.star_count
  - 原 item_used / item_collected 不再逐次上报，转为结算汇总字段
  - 原 props_sweeper / props_magnet / props_fan / props_ufo 不再单独打事件，按功能归类到 battle_result 道具计数字段

formal_events:
  - ta_app_install
  - ta_app_start
  - ta_app_end
  - ta_app_crash
  - page_view
  - page_duration
  - battle_start
  - battle_result
  - currency_changed
  - purchase_success
  - level_fail_shop_click

