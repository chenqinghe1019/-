current_event_mapping:
  level_result: battle_result
  star_1: battle_result.star_count=1
  star_2: battle_result.star_count=2
  item_used: battle_result aggregate
  item_collected: battle_result aggregate
  props_sweeper: battle_result prop counter
  props_magnet: battle_result prop counter
  props_fan: battle_result prop counter
  props_ufo: battle_result prop counter
  item_exchange: currency_changed when used only for in-battle currency exchange
  shop_level_fail_bp: level_fail_shop_click
  thinkingdata_editor_test: exclude_from_production

open_questions:
  - shop_level_fail_bp 中 bp 的真实业务含义需研发确认
  - 扇子、磁铁、清扫车、UFO 分别映射到 remove_prop_cnt / shuffle_prop_cnt / other_prop_cnt 的规则需玩法侧确认
  - game_channel 正式环境枚举需确认，当前样本值均为 debug
