project: 下方了
project_code: xiafangle
project_id: 41
created_at: '2026-08-24'
updated_at: '2026-08-24'
topic: 按日期、开服天数与截至当天累计付费分层的战力绝对提升监控
sql_file: sql/xiafangle/战力监控_按日累计付费分层_提升分布.sql

population:
  active_event: in_out_log
  rule: 仅统计查询周期内实际存在in_out_log的活跃角色
  date_filter: '${PartDate:date}'
  final_grouping:
    - 日期
    - 开服天数
    - 截至当天累计付费分层
  date_display: true
  open_day_rule: 活跃日期 - server_open_time + 1，开服当天记D1
  user_domain_filter: release

cumulative_payment:
  event: pay_log
  field: payment
  source_unit: 分
  display_unit: 元
  conversion: payment / 100.0000
  window: 截至该活跃日，包含当天
  note: 为避免历史日期被当前用户表total_payment污染，不使用当前快照total_payment做历史分层
  payment_filter: payment > 0
  pay_result_filter: 不额外限制
  segments:
    - a_free: 0
    - 'b_(0,6]': '(0,6]'
    - 'c_(6,30]': '(6,30]'
    - 'd_(30,100]': '(30,100]'
    - 'e_(100,300]': '(100,300]'
    - 'f_(300,500]': '(300,500]'
    - 'g_(500,1000]': '(500,1000]'
    - 'h_(1000,+)': '(1000,+)'

power_growth:
  event: change_power_log
  confirmed_fields:
    - before
    - after
    - num
    - result
    - change_reason
  start_power: min_by(before, '#event_time')
  end_power: max_by(after, '#event_time')
  daily_growth: end_power - start_power
  use_mathematical_abs: false
  negative_growth: 战力下降时保留负数
  no_change_log: 当日活跃但没有有效change_power_log时按0参与分布
  percentile_population: P25/P50/P75/P99按同日期、同开服天数、同累计付费分层下全部活跃玩家计算，0和负数参与
  max_to_p99: 最大战力提升 / P99战力提升；P99=0时返回NULL
  warning: change_power_log可能有服务端后台重算，因此禁止单独用其判定活跃，只在in_out_log活跃日纳入统计

metrics:
  - 活跃玩家数
  - 战力有变动玩家数
  - 战力提升玩家数
  - 平均战力提升
  - 最小战力提升
  - P25战力提升
  - P50战力提升
  - P75战力提升
  - P99战力提升
  - 最大战力提升
  - 最大值/P99倍数
