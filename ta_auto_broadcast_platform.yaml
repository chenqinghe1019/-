ta_auto_broadcast_platform:
  status: "idea_mvp"
  goal: "从数数（ThinkingData）稳定拉取项目看板/报表或等价查询结果，定时生成数据播报、异常提示和分析结论。"

  architecture:
    data_source_priority:
      - "优先使用数数 Open API / 模型查询 API / SQL 查询 API 拉取数据，不依赖网页 DOM 爬取。"
      - "如需复用现有看板配置，先读取 dashboardId、reportId、reportName、reportModel，再按报表配置执行等价查询。"
      - "仅在官方/内部接口无法覆盖时，才考虑接管已登录浏览器会话读取页面数据。"
    layers:
      - "取数层：按项目、报表、时间范围拉取结构化数据。"
      - "口径层：统一项目表后缀、指标定义、付费单位、留存/新增/分层口径。"
      - "判断层：同比/环比、阈值、分层贡献、结构变化、异常检测。"
      - "分析层：根据预设分析规则生成原因假设、影响范围、排查建议。"
      - "播报层：输出企业微信/飞书/Slack/邮件等可读消息，保留关键指标和异常结论。"

  mvp_scope:
    projects:
      - "先接 1 个项目和 1 张核心经营看板。"
    cadence:
      - "建议先做每日固定时间播报，后续再做小时级异常监控。"
    metrics_example:
      - "新增、活跃、付费人数、收入、首日LTV、次留。"
      - "按媒体、付费分层、系统等关键维度拆分。"
    output_sections:
      - "今日核心指标。"
      - "较昨日/近7日均值变化。"
      - "异常项 Top N。"
      - "主要贡献维度。"
      - "可能原因与建议排查项。"

  analysis_rules:
    first_stage:
      - "先用确定性规则识别异常，不让大模型直接自由判断全部数字。"
      - "变化率阈值与绝对量阈值同时使用，避免小样本误报。"
      - "对新增、收入、留存、LTV分别配置不同阈值。"
      - "自动下钻媒体、渠道、付费分层、系统、版本等维度，寻找主要贡献项。"
    llm_role:
      - "负责把结构化异常结果翻译成业务结论、解释和排查建议。"
      - "结论必须引用本次实际数据，不编造原因。"
      - "无法确定原因时明确标记为假设，并给出下一步验证指标。"

  security:
    - "不在仓库保存数数账号、密码、token、ACCESS_TOKEN 或 Authorization 信息。"
    - "生产服务的查询密钥使用服务器密钥管理或环境变量管理。"
    - "播报消息默认只发送聚合数据，不发送玩家级敏感明细。"

  rollout:
    phase_1: "单项目单看板：定时拉数 + 固定模板播报。"
    phase_2: "加入环比/同比、阈值异常和维度自动下钻。"
    phase_3: "加入大模型分析、历史异常案例库和排查建议。"
    phase_4: "多项目配置化接入、自助选择看板/报表、告警订阅。"

  related_knowledge:
    - "ta_data_operation_map.yaml"
    - "ta_dashboard_report_workflow.yaml"
    - "tracking_projects.yaml"
