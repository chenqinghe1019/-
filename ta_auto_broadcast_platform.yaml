ta_auto_broadcast_platform:
  status: "idea_mvp"
  goal: "不通过数数 Open API，直接接管已登录浏览器，从数数看板自动读取/导出数据，完成汇总、异常分析和定时播报。"

  user_intent:
    - "数据源以数数现有看板为准，不重新调用 Open API 或自定义 SQL API取数。"
    - "自动化过程尽量模拟人工：进入看板、切项目/日期/筛选器、读取或导出报表数据。"
    - "优先复用已经验证过的看板口径，让看板成为播报平台的标准数据入口。"

  architecture:
    browser_control:
      preferred: "CDP 接管已登录 Chrome 会话"
      scripts:
        - ".codex/scripts/ta_start_cdp.ps1"
        - "ta_cdp_tool.ps1"
      security:
        - "用户手动登录数数。"
        - "自动化只接管已登录会话。"
        - "不保存、不打印账号、密码、ACCESS_TOKEN。"
    dashboard_collection:
      flow:
        - "打开指定项目与指定看板。"
        - "等待看板所有报表加载完成。"
        - "按配置切换日期、媒体、系统、区服等看板筛选条件。"
        - "按报表标题定位目标卡片，例如新增、活跃、收入、留存、LTV、付费分层等。"
        - "优先读取表格/图表对应的结构化 DOM 数据；如卡片支持导出，则可自动点击导出并读取 xlsx/csv。"
        - "对趋势图保留日期序列，对表格保留维度与指标明细。"
        - "记录看板名、报表名、筛选条件、数据时间和抓取时间，便于追溯。"
      avoid:
        - "默认不使用 OCR 识别截图中的数字。"
        - "默认不通过 Open API/SQL API 重算已有看板指标。"
        - "不要只读取页面当前可见的一屏；表格需处理分页、滚动或导出完整数据。"
    normalization:
      - "按报表名建立指标字典，识别新增、活跃、付费人数、收入、ARPU、LTV、留存等字段。"
      - "统一百分比、金额、人数、倍率、百分点等数据类型。"
      - "看板已定义好的业务口径直接复用，不在播报侧二次改变口径。"
    analysis:
      - "环比：昨日 vs 前日。"
      - "基线：昨日 vs 近7日/近14日均值。"
      - "趋势：连续上涨/下降、拐点、波动扩大。"
      - "贡献分析：按看板已有的媒体、系统、付费分层、区服等维度寻找主要贡献项。"
      - "异常先由确定性规则判断，再交给大模型生成解释和排查建议。"
    broadcast:
      - "输出核心指标摘要。"
      - "输出异常 Top N。"
      - "输出主要贡献维度。"
      - "输出数据支持的原因判断；不能确认的原因标记为待验证。"
      - "后续可接企业微信/飞书/邮件/Web 页面。"

  example_dashboard:
    type: "经营分析看板"
    suitable_cards:
      - "DAU/新增/活跃等核心人数指标卡。"
      - "收入、付费人数、ARPU/ARPPU/LTV 等经营指标。"
      - "日趋势折线图。"
      - "按媒体、系统、渠道等维度拆分的趋势或表格。"
      - "留存趋势和付费分层表。"
    collection_strategy:
      - "指标卡直接读取当前值与对比值。"
      - "趋势图读取完整时间序列，而不是只截取图形。"
      - "明细表优先导出完整数据，避免分页和虚拟滚动造成漏数。"

  phase_0_poc:
    purpose: "先证明浏览器自动化能稳定、准确地从一张数数看板抓出结构化数据，再开始做分析和播报。"
    pilot_dashboard:
      dashboard_name: "新增分析-留存LTV（角色）"
      first_report: "新增LTV（角色）"
      second_report: "留存热力/留存表"
      reason:
        - "先从标准表格开始，字段清晰，最容易人工核对。"
        - "首张报表抓取稳定后，再扩展到热力图、趋势图和筛选器。"
    first_run_steps:
      - "使用现有 ta_start_cdp.ps1 启动独立 Chrome。"
      - "用户手动登录数数，自动化仅接管已登录会话。"
      - "进入目标项目和目标看板。"
      - "按报表标题定位“新增LTV（角色）”卡片，不依赖固定屏幕坐标。"
      - "优先读取表格 DOM；若数数提供卡片导出，则优先测试导出完整数据。"
      - "保存原始结构化结果，字段至少包含日期、登录登出角色数、当日、第1日~第7日。"
      - "记录本次看板名、筛选条件、抓取时间和数据行数。"
    acceptance:
      - "程序读取结果与看板人工看到的数据一致。"
      - "重复运行 3 次结果一致，不因页面位置、滚动位置变化而漏数。"
      - "表格存在虚拟滚动或分页时仍能拿到完整数据。"
      - "登录失效、看板名变化、报表加载失败时明确报错，不使用旧缓存冒充新数据。"
      - "不保存账号密码或 ACCESS_TOKEN。"
    output_example:
      format: "json/csv/xlsx 均可，P0 优先 json + csv"
      fields:
        - "dashboard_name"
        - "report_name"
        - "filters"
        - "collected_at"
        - "rows"
    next_after_pass:
      - "加入顶部留存报表采集。"
      - "加入全局筛选器自动切换。"
      - "一次性采集整张看板的目标报表。"
      - "再做环比、近7日基线和播报文案。"

  mvp_scope:
    phase_1:
      - "先选 1 个项目 + 1 张经营看板。"
      - "先固定日期范围，例如最近14天。"
      - "自动抓取 5~10 张核心报表。"
      - "生成一份本地结构化数据快照和固定模板播报。"
    phase_2:
      - "加入看板筛选器自动切换，例如媒体/系统。"
      - "加入环比、7日均值和异常阈值。"
    phase_3:
      - "加入自动下钻与大模型分析。"
      - "同一异常自动读取相关卡片交叉验证。"
    phase_4:
      - "多项目、多看板配置化；可设置不同播报规则。"

  recommended_config:
    dashboard_name: "由项目配置"
    report_rules:
      - "report_title: 新增用户"
      - "report_title: 活跃用户"
      - "report_title: 收入/付费"
      - "report_title: 留存"
      - "report_title: LTV"
    filter_rules:
      - "日期范围"
      - "媒体"
      - "系统"
    alert_rules:
      - "环比变化率阈值"
      - "近7日均值偏离阈值"
      - "连续N日趋势规则"

  reliability:
    - "每次读取前确认项目名、看板名和筛选条件。"
    - "等待报表加载完成后再采集。"
    - "采集后做行数、字段、日期范围和空值校验。"
    - "关键指标可在同一看板不同卡片之间做交叉校验。"
    - "页面结构变化导致定位失败时应报错，不静默使用旧数据。"

  related_knowledge:
    - "ta_data_operation_map.yaml"
    - "ta_dashboard_report_workflow.yaml"
    - "tracking_projects.yaml"
