ltv_forecast_model:
  version: "v1.0"
  created_at: "2026-08-19"
  purpose: "基于按新增日期展开的累计 LTV cohort 矩阵，对未成熟 cohort 预测 D30 / D60 / D90。"
  source_structure:
    columns:
      - "新增日期"
      - "新增用户数"
      - "指标"
      - "D1...Dn 累计LTV"
    notes:
      - "LTV 必须是累计值；缺失的未成熟天数保持空值或非数值占位。"
      - "cohort 按日期从旧到新排列时，模型更容易检查成熟度和异常。"
  algorithm:
    step_factor:
      definition: "Factor(d→d+1) = 同时拥有 Dd 与 Dd+1 的 cohort 的用户数加权平均 LTV(d+1) / 用户数加权平均 LTV(d)"
      weighting: "新增用户数"
    reliability_shrinkage:
      min_reliable_cohorts_default: 7
      reliability: "min(1, 有效cohort数 / 最低可靠样本数)"
      stable_growth_window: "D14→D23"
      rule: "样本不足时，原始日增长率按可靠度向稳态日增长率收缩。"
    tail_forecast:
      tail_start_day_default: 28
      auto_initial_growth_window: "D18→D26"
      daily_decay_default: 0.94
      rule: "超过尾部起始日后，日增长率(t)=尾部初始日增长率×衰减系数^(t-尾部起始日)。"
    recursive_forecast:
      rule: "LTV(d+1)=LTV(d)×模型递进因子(d→d+1)"
      horizons:
        - 30
        - 60
        - 90
  confidence_rule:
    high: "实测天数 >= 14"
    medium: "7 <= 实测天数 < 14"
    medium_low: "3 <= 实测天数 < 7"
    low: "实测天数 < 3"
    note: "D60/D90 超出当前样本成熟度时，即使 cohort 已较成熟，也应视为尾部外推。"
  backtest:
    anchors:
      - "D3→D14"
      - "D7→D21"
      - "D14→D28"
    metric: "MAPE"
    principle: "回测明显变差时，优先按版本、渠道、活动阶段拆 cohort，避免仅靠调尾部参数硬拟合。"
  reference_dataset_2026_08_18:
    max_observed_day: 28
    stable_daily_growth: 0.01676015445632716
    auto_tail_initial_daily_growth: 0.011904646950120945
    backtest_mape:
      D3_to_D14: 0.1781279947126642
      D7_to_D21: 0.10617000324561263
      D14_to_D28: 0.1307625773229244
  workbook_layout:
    sheets:
      - "原始数据"
      - "模型说明"
      - "参数设置"
      - "增长曲线"
      - "LTV预测"
      - "回测"
      - "辅助计算"
  usage_notes:
    - "D30 是当前样本下优先使用的短中期预测目标。"
    - "D60/D90 对尾部衰减假设更敏感，应用时必须结合版本变化、投放结构和付费点改版判断。"
    - "若换另一个游戏，优先替换 cohort LTV 原始数据，再观察回测误差；不要直接沿用旧游戏的尾部参数。"
