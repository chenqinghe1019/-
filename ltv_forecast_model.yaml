ltv_forecast_model:
  version: "v1.7"
  updated_at: "2026-08-19"
  purpose: "LTV 两阶段模型：先按逐日同样本加权倍率补全 D1-D28 未成熟 cohort，再基于修正后的补全曲线做长期预测，并增加预测与补全加权曲线的重叠偏差校验。"

  source_structure:
    source_max_day: 28
    columns:
      - "新增日期"
      - "新增用户数"
      - "指标"
      - "D1...D28 累计LTV"
    rules:
      - "补值矩阵严格只生成 D1-D28，不生成 D29 以后 cohort 数据。"
      - "真实成熟 LTV 永不覆盖；仅对未成熟单元格补值。"
      - "D29+ 只允许存在于长期预测层。"

  stage_value_definition:
    formula: "StageLTV(Dn)=Σ[新增用户数_i×LTV_i(Dn)]/Σ新增用户数_i，仅统计真实成熟到 Dn 的 cohort。"
    weighting: "新增用户数"
    warning: "不同 Dn 的成熟 cohort 集合不同，不能直接用全体阶段值相除作为倍率。"

  phase1_cohort_imputation:
    model: "逐日同样本加权倍率递推"
    daily_multiplier:
      target_day: "Dt"
      historical_reference: "只使用真实成熟到 Dt 的历史 cohort 集合 J(t)。"
      formula: "R(t)=WeightedLTV_Dt(J(t))/WeightedLTV_D(t-1)(J(t))"
      weighting: "新增用户数"
      key_rule: "分子与分母必须使用同一批真实成熟到 Dt 的 cohort。"
    imputation:
      formula: "若 cohort i 的 Dt 未成熟，则 FilledLTV_i(Dt)=FilledLTV_i(D(t-1))×R(t)。"
      recursive: true
      max_day: 28
      note: "若前一日是预测值，则继续以该预测值乘下一日历史同样本日倍率向后递推。"
    verified_example:
      cohort: "2026-08-18"
      target: "D2"
      historical_mature_range: "2026-07-22~2026-08-17"
      mature_cohorts: 27
      mature_users: 72885
      same_cohort_weighted_D1: 2.814264937915895
      same_cohort_weighted_D2: 4.744488715099128
      D2_D1_multiplier: 1.6858713801880576
      cohort_D1_actual: 4.35
      cohort_D2_filled: 7.33354050381805
      formula: "4.35×1.6858713801880576=7.33354050381805"

  filled_stage_curve:
    formula: "FilledStageLTV(Dt)=Σ[新增用户数_i×FilledLTV_i(Dt)]/Σ全部新增用户数_i"
    actual_coverage: "真实成熟到 Dt 的新增人数 / 全部新增人数"
    current_examples:
      D1: 2.8635580728267507
      D2: 4.827590600485089
      D3: 6.214986382160555
      D7: 9.693580795577041
      D14: 12.092804380739501
      D21: 13.61959818045689
      D22: 13.756095880986694
      D28: 14.538219269395164

  phase2_long_term_forecast:
    separation_rule: "D29+ 仅属于长期预测结果，不写回 cohort 补值矩阵。"
    preprocessing: "长期拟合使用补全阶段值并做累计 LTV 单调校正。"
    current_fit_window: "D7-D22"
    base_model:
      name: "对数累计 LTV 长尾"
      regression: "CorrectedLTV(d)=intercept+slope×ln(d)，D22 后从 D22 锚点连续外推。"
      slope_current: 3.6331145439381847
      anchor_day: 22
      anchor_ltv: 13.756095880986694
      D1_ltv: 2.8635580728267507
      continuation: "LTV(d)=LTV(D22)+slope×ln(d/22), d>22"
    scenarios:
      conservative_slope_factor: 0.85
      base_slope_factor: 1.0
      aggressive_slope_factor: 1.15
      note: "保守/进取是经营情景，不是统计置信区间。"
    current_base_output:
      D30: {ltv: 14.882924261881485, multiplier_vs_D1: 5.197353740827006}
      D60: {ltv: 17.401207364663584, multiplier_vs_D1: 6.076778232573453}
      D90: {ltv: 18.874308545990836, multiplier_vs_D1: 6.591208582460887}
      D180: {ltv: 21.39259164877293, multiplier_vs_D1: 7.470633074207332}
      D360: {ltv: 23.910874751555035, multiplier_vs_D1: 8.35005756595378}
      D720: {ltv: 26.429157854337134, multiplier_vs_D1: 9.229482057700226}

  validation_framework:
    overlap_consistency_check:
      purpose: "检查长期预测曲线与 phase1 补全后的加权阶段曲线是否衔接一致。"
      train_window: "D7-D22"
      compare_window: "D23-D28"
      rows:
        D23: {filled_ltv: 13.874509081055795, forecast_ltv: 13.917594226086479, relative_error: 0.0031053455498120833}
        D24: {filled_ltv: 14.208039869192362, forecast_ltv: 14.072218180215808, relative_error: -0.00955949520320952}
        D25: {filled_ltv: 14.346703656889211, forecast_ltv: 14.220529162219913, relative_error: -0.008794667938144096}
        D26: {filled_ltv: 14.515352337968373, forecast_ltv: 14.363022505600727, relative_error: -0.01049439440537669}
        D27: {filled_ltv: 14.538219269395164, forecast_ltv: 14.500137440088206, relative_error: -0.0026194287347917878}
        D28: {filled_ltv: 14.538219269395164, forecast_ltv: 14.632265257054181, relative_error: 0.006468879435392488}
      summary:
        MAPE: 0.006840368544454445
        WAPE: 0.0068534274188446044
        bias: -0.0036651114641474657
        max_absolute_relative_error: 0.01049439440537669
        conclusion: "D23-D28 相对偏差全部约在 ±1.1% 内，长期预测与补全加权曲线衔接良好。"
      limitation: "D23-D28 的补全加权值本身包含插值，因此该偏差是模型一致性校验，不代表独立真实预测准确率。"
    true_accuracy_backtest:
      method: "遮盖回测 / leave-one-out。对已经真实成熟的 cohort 人为截断到 D7/D14 等成熟日，使用其余历史 cohort 的倍率补后续，再与被遮盖 cohort 的真实 D21/D28 比较。"
      metrics:
        - "MAPE"
        - "WAPE"
        - "Bias"
      rule: "判断 D60/D180/D720 是否可信时，必须同时参考重叠一致性和独立遮盖回测；不能只看拟合曲线。"

  workbook_v1_7:
    filename: "LTV预估模型_修正插值_含偏差校验.xlsx"
    added_sheet: "长期预测偏差校验"
    sheets:
      - "原始数据"
      - "成熟标记"
      - "逐日加权倍率"
      - "补全矩阵"
      - "补值标记"
      - "补全阶段值"
      - "插值校验"
      - "长期拟合"
      - "长期预测参数"
      - "LTV预估结果"
      - "长期预测偏差校验"

  usage_notes:
    - "插值与长期预测必须分层：D1-D28 是 cohort 补值，D29+ 是预测结果。"
    - "每个日倍率必须由同一批真实成熟到目标日的 cohort 计算。"
    - "长期预测与补全曲线必须在重叠区间做偏差校验；当前 D23-D28 MAPE≈0.684%、WAPE≈0.685%、Bias≈-0.367%。"
    - "低重叠偏差只能说明两阶段衔接顺，不等于真实预测准确；仍需遮盖回测。"
