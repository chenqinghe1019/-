ltv_forecast_model:
  version: "v1.4"
  updated_at: "2026-08-19"
  purpose: "当前优先目标不是直接做 D720 长期拟合，而是先利用历史成熟 cohort 的同样本加权倍率，把未成熟 cohort 的累计 LTV 补全，形成更完整的 cohort LTV 矩阵；后续再基于补全数据做长期倍率/预测。"

  source_structure:
    columns:
      - "新增日期"
      - "新增用户数"
      - "指标"
      - "D1...Dn 累计LTV"
    notes:
      - "LTV 为 cohort 累计 LTV。"
      - "未成熟阶段保持空值或非数值占位，作为待补值。"

  stage_value_definition:
    rule: "原表‘阶段值’是该阶段已成熟 cohort 的累计 LTV，按各 cohort 新增用户数加权聚合。"
    formula: "StageLTV(Dn)=Σ[新增用户数_i×LTV_i(Dn)]/Σ新增用户数_i，仅统计已成熟到 Dn 的 cohort。"
    weighting: "新增用户数"
    important_effect: "不同 Dn 的成熟 cohort 集合不同，因此不同阶段值不能直接相除作为倍率。"

  preferred_workflow:
    - "Step 1：保留所有 cohort 的真实已成熟 LTV。"
    - "Step 2：针对每个未成熟 cohort，识别其最后一个真实成熟日 N。"
    - "Step 3：用历史上已成熟到目标日 M 的同一批 cohort，计算 D_N→D_M 的新增人数加权倍率。"
    - "Step 4：未成熟 cohort 的 D_M 预测值 = 该 cohort 实测 D_N LTV × 历史同样本加权倍率(N→M)。"
    - "Step 5：重复补全所有目标天数，得到实测+预测混合的完整 cohort LTV 矩阵。"
    - "Step 6：基于补全后的矩阵重新计算阶段值、D1倍率、版本/渠道分组差异，并在数据成熟度足够后再做 D180/D360/D720 长期预测。"

  imputation_model:
    name: "同样本加权倍率补值"
    maturity_anchor:
      definition: "N = 当前 cohort 最后一个有真实累计 LTV 的成熟日。"
      rule: "真实值永不覆盖；只补 N 之后的空白。"
    target_day:
      definition: "M = 需要补值的目标天数，M>N。"
    historical_reference_set:
      definition: "J(M) = 历史上已经真实成熟到 D_M 的 cohort 集合。"
      rule: "计算起点 D_N 和目标 D_M 时必须使用完全相同的 J(M)，禁止分别用各自阶段值。"
    weighting:
      field: "新增用户数"
      formula_start: "WeightedLTV_N(M)=Σ[j∈J(M)] users_j×LTV_j(N) / Σ[j∈J(M)] users_j"
      formula_target: "WeightedLTV_M=Σ[j∈J(M)] users_j×LTV_j(M) / Σ[j∈J(M)] users_j"
    multiplier:
      formula: "R(N→M)=WeightedLTV_M / WeightedLTV_N(M)"
    imputed_value:
      formula: "PredLTV_i(M)=ActualLTV_i(N)×R(N→M)"
      preferred: "优先直接使用 N→M 倍率，不推荐用 N→N+1→...→M 连续逐日连乘，以减少误差累积。"

  multi_anchor_model:
    status: "已实现，可配置"
    parameter: "前N天锚点数"
    anchor_days: "k ∈ [max(1,N_last-N+1), N_last]"
    each_anchor_prediction: "Pred_k(M)=ActualLTV_i(k)×R(k→M)"
    combined_prediction: "Pred(M)=Σ alpha_k×Pred_k(M) / Σ alpha_k"
    weight_rule: "越靠近最后真实成熟日权重越高，依次使用 1,2,...,N。"
    current_default_N: 1
    current_reason: "当前文件 leave-one-out 遮盖回测中 N=1 的整体 WAPE 最低。"

  sparse_tail_control:
    min_reference_cohorts_default: 5
    tail_daily_multiplier_window_default: 5
    rule: "当目标日真实成熟 cohort 数低于阈值时，不直接使用稀疏目标日倍率；从可靠倍率截止日开始，使用最近 K 个可靠同 cohort 日倍率，按成熟新增用户数加权后向后外推。"
    current_reference:
      reliable_cutoff_day: 24
      tail_daily_multiplier: 1.0124553870053676
      total_new_users: 75302
    note: "当前 D25 及以后成熟 cohort 少于 5 个，因此补值不直接依赖 D25-D28 的 4/3/2/1 个 cohort。"

  validation:
    method: "leave-one-out 遮盖回测 / rolling backtest"
    metrics:
      - "MAPE"
      - "WAPE（新增用户数加权）"
      - "加权 Bias"
    current_N_comparison:
      N1: {samples: 123, MAPE: 0.15276920449645187, WAPE: 0.15006612832080188, weighted_bias: 0.0034102037326095903}
      N2: {samples: 123, MAPE: 0.15882887692575953, WAPE: 0.15632364599105839, weighted_bias: 0.0035901680271152895}
      N3: {samples: 123, MAPE: 0.1641669149181428, WAPE: 0.16094974920461566, weighted_bias: 0.0035670408196169442}
      N5: {samples: 123, MAPE: 0.1693412364072677, WAPE: 0.16732615293445613, weighted_bias: 0.003969186374311338}
      N7: {samples: 123, MAPE: 0.1761217900561904, WAPE: 0.17468745929925536, weighted_bias: 0.004335578468093591}
    current_selected_N: 1
    selected_rule: "当前选择整体 WAPE 最低的 N；换游戏或补充更多成熟 cohort 后重新回测。"
    maturity_effect_note: "成熟度越高后再补值误差明显更低，因此阶段汇总必须同时展示实测覆盖率。"

  workbook_v1_4:
    filename: "LTV_Cohort补值模型.xlsx"
    sheets:
      - "原始数据"
      - "辅助_成熟标记"
      - "参数设置"
      - "日倍率"
      - "倍率矩阵"
      - "辅助_锚点权重"
      - "补全矩阵"
      - "补值标记"
      - "补全阶段值"
      - "参数回测"
      - "遮盖回测汇总"
      - "遮盖回测明细"
      - "模型说明"
    outputs:
      - "补全矩阵：保留真实值，空白未成熟值自动预测。"
      - "补值标记：区分实测 / 预测 / 无依据。"
      - "补全阶段值：同时输出原表阶段值、实测重算、补全阶段值、实测覆盖率、预测占比。"
      - "参数回测：比较 N=1/2/3/5/7。"
      - "遮盖回测：按模拟成熟日与目标日查看 MAPE/WAPE/Bias。"

  long_tail_forecast:
    status: "暂缓作为主模型"
    reason: "当前历史成熟度不足，先完成未成熟 cohort 补全与稳定回测。"
    future_rule: "当真实成熟窗口明显拉长后，再重新评估 D180/D360/D720 的长期模型。"

  usage_notes:
    - "当前主模型目标是‘补齐数据’，不是给出看似精确的 D720 单点倍率。"
    - "不能使用 StageLTV(D_M)/StageLTV(D_N) 直接补值，因为两者历史 cohort 集合不同。"
    - "补值倍率必须在成熟到目标日 M 的同一批 cohort 上，同时计算 D_N 和 D_M。"
    - "真实成熟值一旦出现，应覆盖之前的预测值，并进入下一轮倍率训练/回测。"
    - "分析补全阶段值时必须同时看实测覆盖率；覆盖率低时应降低结论置信度。"
