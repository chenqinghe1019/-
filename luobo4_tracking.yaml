            display_name: "当前所在教程步骤"
            type: "double"
            source_type: "数值"
          - name: "guide_name"
            display_name: "当前所在教程名称"
            type: "varchar"
            source_type: "字符串"
      - tag: "付费模块（人民币消费）"
        event_name: "order_init"
        display_name: "发起订单"
        trigger: "用户发起充值订单"
        properties:
