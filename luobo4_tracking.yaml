            display_name: "订单号"
            type: "varchar"
            source_type: "字符串"
          - name: "product_id"
            display_name: "礼包id"
            type: "double"
            source_type: "数值"
          - name: "product_name"
            display_name: "礼包名称"
            type: "varchar"
            source_type: "字符串"
          - name: "pay_amount"
            display_name: "支付金额"
