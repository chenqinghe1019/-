            source_type: "布尔"
          - name: "item_list"
            display_name: "道具列表"
            type: "array(varchar)"
            source_type: "列表"
            description: "本次计划使用的道具id列表（原表写作：站前道具已勾选）"
      - tag: "主线"
        event_name: "level_dead"
        display_name: "关卡内死亡"
        trigger: "在关卡内死亡时触发"
        properties:
          - name: "level_id"
            display_name: "关卡ID"
            type: "double"
            source_type: "数值"
          - name: "rounds"
            display_name: "回合数"
            type: "double"
            source_type: "数值"
            description: "第几回合死亡"
      - tag: "主线"
        event_name: "level_revival"
        display_name: "关卡内复活"
        trigger: "在关卡内复活时触发"
        properties:
          - name: "level_id"
            display_name: "关卡ID"
            type: "double"
            source_type: "数值"
          - name: "rounds"
            display_name: "回合数"
            type: "double"
            source_type: "数值"
            description: "第几回合复活"
      - tag: "主线"
        event_name: "level_result"
        display_name: "关卡结算"
        trigger: "关卡结束时触发，记录结果"
        properties:
          - name: "level_id"
            display_name: "关卡ID"
            type: "double"
            source_type: "数值"
            description: "参数格式：主题.关卡数"
            validation_issue: "数值类型与点分格式是否兼容需确认"
          - name: "is_first_try"
            display_name: "是否首次挑战"
            type: "boolean"
            source_type: "布尔"
          - name: "item_list"
            display_name: "道具列表"
            type: "array(varchar)"
            source_type: "列表"
          - name: "is_win"
            display_name: "是否胜利"
            type: "boolean"
            source_type: "布尔"
          - name: "rounds"
            display_name: "回合数"
            type: "double"
            source_type: "数值"
          - name: "remain_power"
            display_name: "剩余体力"
            type: "double"
            source_type: "数值"
          - name: "coin_num"
            display_name: "获得的金币数量"
            type: "double"
            source_type: "数值"
          - name: "carrot"
