    events:
      - tag: "基础数据"
        event_name: "ta_app_install"
        display_name: "游戏安装"
        trigger: "客户端开启自动采集后，即可采集"
        properties: []
      - tag: "基础数据"
        event_name: "ta_app_start"
        display_name: "游戏启动"
        trigger: "在游戏启动时触发，需开始计时"
        properties: []
      - tag: "基础数据"
        event_name: "ta_app_end"
        display_name: "游戏登出"
        trigger: "游戏登出时记录，结束计时"
        properties:
          - name: "#duration"
            display_name: "在线时长"
            type: "double"
            source_type: "数值"
      - tag: "基础数据"
        event_name: "register"
        display_name: "用户注册"
        trigger: "注册完成后"
        properties: []
      - tag: "基础数据"
        event_name: "login"
        display_name: "用户登录"
        trigger: "用户登录"
        properties: []
      - tag: "新手引导"
