            source_type: "数值"
          - name: "product_name"
            display_name: "礼包名称"
            type: "varchar"
            source_type: "字符串"
          - name: "pay_amount"
            display_name: "支付金额"
            type: "double"
            source_type: "数值"
            validation_issue: "金额单位未填写"
          - name: "is_first_pay"
            display_name: "是否首次充值"
            type: "boolean"
            source_type: "布尔"
      - tag: "付费模块（人民币消费）"
        event_name: "order_finish"
        display_name: "订单完成"
        trigger: "订单完成"
