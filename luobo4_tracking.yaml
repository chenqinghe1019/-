            type: "unspecified"
            source_type: null
            description: "0（死亡）1（木萝卜）2（银萝卜）3（金萝卜）"
          - name: "clear"
            display_name: null
            type: "unspecified"
            source_type: null
            description: "0（未全清）1（全清）"

