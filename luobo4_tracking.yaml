    project_code: "luobo4"
    project_type: "小游戏"
    table_suffix: 37
    user_table: "ta.v_user_37"
    event_table: "ta.v_event_37"
    source_document:
      file: "10a37de7-2e7a-4fde-838c-2c78911e7524.xlsx"
      imported_at: "2026-08-03"
      sheets:
        user_id_system: "#用户ID体系!A1:E5"
        events: "#事件数据!A1:H94"
        common_event_properties: "#公共事件属性!A1:D18"
        user_properties: "#用户数据!A1:G26"
      repository_policy: "原始 Excel 不提交；本文件记录可检索的结构化埋点口径。"

    status: "初版埋点，存在技术命名、类型及用户 ID 模式待确认项"
    summary:
      named_event_count: 14
      pending_asset_event_name_count: 8
      event_property_row_count: 89
      common_event_property_count: 6
      named_user_property_count: 12
      unnamed_virtual_user_property_count: 1

    notes:
      - "数数项目表后缀已确认为 37：用户表 ta.v_user_37，事件表 ta.v_event_37；正式环境过滤条件仍待确认。"
      - "线上已确认 ta.v_user_37 不存在 domain、create_role_time 字段；新增日期统计使用 ta.v_event_37 的 register 事件日期（$part_date），不要套用其他项目的用户表创角字段。"
      - "用户 ID 体系页同时提供单账号单角色、单账号多角色两种模板，未标明萝卜4实际采用哪一种。"
      - "公共属性原表字段名为 sever，疑似 server 的拼写问题；在研发确认前必须按原文保留，不得静默改名。"
      - "8 类产出与消耗事件的英文事件名及全部属性类型均未填写。"
      - "level_result.carrot 与 level_result.clear 未填写显示名和属性类型。"
      - "累计充值金额用户属性未填写属性名，原表备注要求使用虚拟属性。"

    user_id_system:
      selected_mode: "pending_confirmation"
      options:
        - game_type: "单账号单角色"
          properties:
            - name: "#account_id"
              display_name: "账户ID"
              description: "系统属性"
              assignment: "设置为玩家账号ID即可"
            - name: "#distinct_id"
              display_name: "访客ID"
              description: "系统属性"
              assignment: "设备相关ID或业务内的访客ID；使用客户端 SDK 时无需关注"
        - game_type: "单账号多角色"
          properties:
            - name: "#account_id"
              display_name: "账户ID"
              description: "系统属性"
              assignment: "设置为角色ID，角色所属账户ID设置为角色的自定义属性"
            - name: "#distinct_id"
              display_name: "访客ID"
              description: "系统属性"
              assignment: "设备相关ID或业务内的访客ID；使用客户端 SDK 时无需关注"

    common_event_properties:
      - name: "channel"
        display_name: "注册渠道"
        type: "varchar"
        source_type: "字符串"
        description: "APP store、应用宝、豌豆荚等渠道"
      - name: "sever"
        display_name: "区服ID"
        type: "varchar"
        source_type: "字符串"
        description: "事件发生时玩家的所属区服"
        validation_issue: "字段名疑似拼写错误，待确认是否应为 server"
      - name: "account_id"
        display_name: "账户ID"
        type: "varchar"
        source_type: "字符串"
        description: "角色的从属账号ID"
      - name: "role_id"
        display_name: "角色ID"
        type: "varchar"
        source_type: "字符串"
      - name: "role_name"
        display_name: "角色名"
        type: "varchar"
        source_type: "字符串"
      - name: "open_id"
        display_name: "微信/抖音小游戏openid"
        type: "varchar"
        source_type: "字符串"

    user_properties:
