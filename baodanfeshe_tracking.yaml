  events:
  - event_name: active_log
    display_name: 激活
    source: 客户端
    trigger: 玩家每进入一个登录节点时
    tag: 激活
    properties:
    - name: '#device_id'
      display_name: 设备ID
      type: varchar
    - name: '#country'
      display_name: 国家地区
      type: varchar
      description: 用户所在国家或地区，根据 IP 地址生成
    - name: '#province'
