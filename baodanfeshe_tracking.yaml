      type: varchar
      description: 用户设备的类型，如iPad,iPhone等
    - name: '#os'
      display_name: 操作系统
      type: varchar
      description: iOS 11.2.2、Android 8.0.0 等
    - name: '#network_type'
      display_name: 网络类型
      type: varchar
      description: 事件发生时的网络状态，如 WIFI、3G、4G 等
    - name: '#app_version'
      display_name: app版本
      type: varchar
      description: 您的 APP 的版本
    - name: '#ip'
      display_name: 客户端ip
      type: double
    - name: device_name
      display_name: 设备名称
      type: varchar
      description: 设备具体型号
    - name: node_id
      display_name: 节点序号
      type: double
      description: '10.程序启动

        20开始加载

        30.结束加载

        40.注册创角

        50.登录

        60. 进入引导战斗

        99. 完成引导战斗（首次）

        101 首次进入大厅（首次）'
    - name: node_name
      display_name: 节点页面名称
      type: varchar
      description: 'Launch.程序启动

        BeginLoading 开始加载

        EndLoading .结束加载

        Register. 进入引导战斗

        Login.登录

        BeginGuideMap.注册创角

        EndGuideMap. 完成引导战斗（首次）

        EnterHome 首次进入大厅（首次）'
