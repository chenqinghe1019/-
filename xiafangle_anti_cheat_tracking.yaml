# 下方了：外挂治理埋点整理
# 来源：用户上传埋点文档；2026-07-29 按最新外挂规则图更新阈值
# 表后缀：41
# 说明：
# - battle_check / boss_battle_result 为外挂治理核心事件
# - total_payment、total_payment_rmb、power、season、channel_id、region_id、create_role_time 等为公共事件属性，优先从 ta.v_event_41 取
# - VIP等级不在用户属性中，需从 vip_change_log 事件的 after 字段取最近值

project:
  name: "下方了"
  table_suffix: 41
  event_table: "ta.v_event_41"
  user_table: "ta.v_user_41"

common_event_properties:
  account_id:
    column: "#account_id"
    display_name: "角色ID"
    type: "varchar"
  nb_open_id:
    column: "nb_open_id"
    display_name: "聚合openID"
    type: "varchar"
  channel_id:
    column: "channel_id"
    display_name: "渠道ID"
    type: "varchar"
    description: "星云channel_id / 包体渠道ID"
  region_id:
    column: "region_id"
    display_name: "区服ID"
    type: "double"
  create_role_time:
    column: "create_role_time"
    display_name: "创角时间"
    type: "timestamp"
  total_payment:
    column: "total_payment"
    display_name: "历史累计充值金额"
    type: "double"
    description: "含代金券"
  total_payment_rmb:
    column: "total_payment_rmb"
    display_name: "历史累计充值金额（RMB）"
    type: "double"
    description: "纯RMB"
  domain:
    column: "domain"
    display_name: "测试服或正式服"
    type: "varchar"
    values:
      dev: "测试服"
      release: "正式服"
  power:
    column: "power"
    display_name: "战力"
    type: "double"
    description: "发生行为时的战力"
  season:
    column: "season"
    display_name: "赛季"
    type: "double"

events:
  battle_check:
    data_type: "服务端+客户端"
    display_name: "战斗数据校验"
    description: "校验战斗数据"
    properties:
      battle_uid:
        display_name: "战斗唯一id"
        type: "varchar"
        description: "为了区分是哪一场战斗"
      battle_type:
        display_name: "战斗类型"
        type: "double"
      map_id:
        display_name: "关卡id"
        type: "double"
      battle_array:
        display_name: "我方阵容信息"
        type: "Array(Object)"
        description: "记录上阵英雄以及伤害统计"
      destroy_time:
        display_name: "城墙破坏时间"
        type: "Array(Object)"
      duration:
        display_name: "战斗时长(秒)"
        type: "double"
      reportHpMax:
        display_name: "城墙血量（客户端）"
        type: "double"
      svrHpMax:
        display_name: "城墙血量（服务端）"
        type: "double"
      refreshCard:
        display_name: "修改刷卡次数"
        type: "double"
      reportNpcHpMax:
        display_name: "怪物生命（客户端）"
        type: "double"
      svrNpcHpMax:
        display_name: "怪物生命（服务端）"
        type: "double"

  boss_battle_result:
    data_type: "服务端+客户端"
    display_name: "部落战斗数据校验"
    properties:
      battle_uid:
        display_name: "战斗唯一id"
        type: "varchar"
        description: "为了区分是哪一场战斗"
      battle_type:
        display_name: "战斗类型"
        type: "double"
        description: "部落boss"
      map_id:
        display_name: "BOSS_ID"
        type: "double"
        description: "具体哪一只BOSS"
      battle_value:
        display_name: "战斗结果"
        type: "varchar"
        description: "单局伤害值"
      battle_time:
        display_name: "战斗时间(秒)"
        type: "double"
        description: "坚持时间"
      rank_before:
        display_name: "之前排名"
        type: "double"
      rank_after:
        display_name: "之后排名"
        type: "double"
      wall_array:
        display_name: "城墙上阵信息"
        type: "Array(Object)"
        description: "记录上阵城墙"
      battle_array:
        display_name: "英雄阵容信息"
        type: "Array(Object)"
        description: "记录上阵英雄"
      reportHpMax:
        display_name: "城墙血量（客户端）"
        type: "double"
      svrHpMax:
        display_name: "城墙血量（服务端）"
        type: "double"
      refreshCard:
        display_name: "修改刷卡次数"
        type: "double"
      hisDamage:
        display_name: "玩家本次部落boss伤害"
        type: "varchar"
      nextRankDamage:
        display_name: "后一名玩家部落boss伤害"
        type: "varchar"
      nextRank:
        display_name: "后一名次"
        type: "double"

  vip_change_log:
    data_type: "服务端"
    display_name: "vip变更"
    description: "vip等级发生变化时"
    properties:
      before:
        display_name: "变化前"
        type: "double"
      after:
        display_name: "变化后"
        type: "double"

anti_cheat_rules:
  pve_duration_abnormal:
    report_name: "pve外挂1.0"
    status: "测试中"
    event: "battle_check"
    abnormal_type: "PVE耗时异常"
    customer_rule: "/"
    logic: "按战力区间、注册天数分组，计算耗时 Z-score，超过3倍标记异常"
    sql_hint: "abs(duration - avg_duration) / std_duration > 3"

  wall_hp_abnormal:
    report_name: "外挂治理new"
    status: "使用中"
    event: "battle_check"
    abnormal_type: "城墙最大生命值异常"
    customer_rule:
      total_payment_gte_30000: "评估"
      total_payment_lt_30000: "直接封"
    logic: "城墙hp（客户端）/城墙hp（服务端）>=2"
    sql_hint: "reportHpMax / svrHpMax >= 2"

  npc_hp_weaken:
    report_name: "外挂治理new"
    status: "使用中"
    event: "battle_check"
    abnormal_type: "怪物生命削弱"
    customer_rule:
      total_payment_gte_30000: "评估"
      total_payment_lt_30000: "直接封"
    logic: "怪物生命（服务端）*0.9 > 怪物生命（客户端）"
    sql_hint: "svrNpcHpMax * 0.9 > reportNpcHpMax"

  refresh_card_modified:
    report_name: "外挂治理new"
    status: "使用中"
    event: "battle_check"
    abnormal_type: "对局内刷卡次数修改"
    customer_rule:
      total_payment_gte_30000: "评估"
      total_payment_lt_30000: "直接封"
    logic: "修改刷卡次数有值"
    sql_hint: "refreshCard is not null"

  boss_damage_abnormal:
    report_name: "boss外挂单3.0"
    status: "使用中"
    event: "boss_battle_result"
    abnormal_type: "部落BOSS伤害异常"
    customer_rule:
      total_payment_gte_30000: "评估"
      total_payment_lt_30000: "直接封"
    logic:
      percentile_grouping: "分战力区间、赛季、自然周、不同boss区间计算 max_p = 伤害分位数上限 approx_percentile"
      conditions:
        - "total_payment < 1000 and battle_value / max_p > 5.55"
        - "total_payment >= 1000 and battle_value / max_p >= 10"
        - "battle_value 为空 -> 异常-伤害溢出"
