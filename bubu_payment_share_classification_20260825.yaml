project:
  name: "步步项目 / 一步两步"
  table_suffix: 22
  updated_at: "2026-08-25"

scope:
  event: "pay_log"
  purpose: "按激活渠道、当笔付费渠道、小黄车标记、system、payment_method 对支付流水进行分成分类"
  note: "该口径是订单支付分类/分成口径，不替代基于历史 log_in_out 的用户转端口径。"

priority:
  - "1. change_reason=8 的小黄车订单优先分类"
  - "2. 非小黄车且付费渠道类型=星云支付，归星云支付"
  - "3. 付费渠道类型=平台支付时，先识别具体业务渠道，再按 system + payment_method 细分；不能仅凭 payment_method 判断小程序或商店包"

platform_payment_final_classification:
  rules:
    - condition: "payment_method IS NULL 或 trim(payment_method)=''"
      result: "payment_method为空"
      priority: 1
    - condition: "payment_method IN ('customer_pay','wxpay') AND system='ios' AND 当笔渠道属于小游戏/小程序渠道"
      result: "小程序-ios客服支付"
      priority: 2
    - condition: "payment_method IN ('customer_pay','wxpay') AND system<>'ios' AND 当笔渠道属于小游戏/小程序渠道"
      result: "小程序-安卓客服支付（如最终不需要单列，可按业务要求合并客服支付）"
      priority: 2
    - condition: "payment_method='douyin_iap' AND system='ios'"
      result: "小程序-ios虚拟支付"
      priority: 3
    - condition: "payment_method='douyin_iap' AND system<>'ios'"
      result: "小程序-安卓虚拟支付"
      priority: 3
    - condition: "payment_method='apple_iap' AND 当笔付费渠道为官方Apple/商店包渠道（例如 channel_id=3048011）"
      result: "商店包-IOS苹果官方支付"
      priority: 3
    - condition: "payment_method='apple_iap' AND 当笔付费渠道属于小游戏/小程序渠道"
      result: "小程序-ios虚拟支付"
      priority: 3
    - condition: "payment_method='wechat_iap' AND system='ios'"
      result: "小程序-ios虚拟支付"
      priority: 4
    - condition: "payment_method='wechat_iap' AND system<>'ios'"
      result: "小程序-安卓虚拟支付"
      priority: 4
    - condition: "payment_method='qr_pay' AND system<>'ios'"
      result: "小程序-安卓虚拟支付"
      priority: 4
    - condition: "其他未命中"
      result: "其他"

clarifications:
  - "不能把 apple_iap 无条件归为小程序-ios虚拟支付。apple_iap 还必须结合当笔付费渠道/业务包判断。"
  - "官方Apple/商店包渠道（当前映射中 channel_id=3048011）+ apple_iap -> 商店包-IOS苹果官方支付。"
  - "小游戏/小程序渠道 + apple_iap -> 小程序-ios虚拟支付。"
  - "iOS 客服支付保留为小程序-ios客服支付；customer_pay、wxpay 均属于客服支付 method，但是否冠以小程序需结合当笔业务渠道。"
  - "douyin_iap 按 system 分流：Android/非iOS -> 小程序-安卓虚拟支付；iOS -> 小程序-ios虚拟支付。"
  - "payment_method 为空需单独输出一列，不并入其他或Android。"
  - "业务形态（小程序/商店包）优先由付费渠道 channel_id/业务端识别，system 和 payment_method 只负责支付方式细分。"
