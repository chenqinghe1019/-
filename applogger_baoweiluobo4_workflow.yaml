    consumption:
      pre_battle_coop: "宝石/消耗/战前道具合作 - 宝石"
      shield: "宝石/消耗/商店-11"
      wallet: "宝石/消耗/商店-12"
      demolition_hammer: "宝石/消耗/商店-13"
      fan_club: "宝石/消耗/商店-14"
      first_aid_kit: "宝石/消耗/商店-15"
      super_ice_cream: "宝石/消耗/商店-16"
      super_bomb: "宝石/消耗/商店-17"
      mystery_ufo: "宝石/消耗/商店-18"
      vehicle: "宝石/消耗/商店-载具"
      treasure_hunt:
        - "宝石/消耗/寻宝 - 100002"
        - "宝石/消耗/寻宝 - 100005"
      in_battle_item: "宝石/消耗/合作 - 战中道具"
      pass_level_purchase: "宝石/消耗/通行证等级购买"
      coop_random_tower: "宝石/消耗/合作随机炮塔"
      pve_ticket: "宝石/消耗/合作挑战券"
