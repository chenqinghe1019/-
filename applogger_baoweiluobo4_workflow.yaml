project:
  name: "保卫萝卜4"
  system: "AppLogger（天梯游戏统计）"
  module: "趋势分析"

platforms:
  - label: "安卓"
    app_name: "保卫萝卜4 (安卓版)"
    page_id: "61c94f91be4ac8fe3886a3d7da56d896"
    trend_url: "https://dev.applogger.cn/#key-indicators:61c94f91be4ac8fe3886a3d7da56d896"
  - label: "iOS"
    app_name: "保卫萝卜4 (苹果版)"
    page_id: "aff87ff1cb9d27c6d4f65d4b7013afd4"
    trend_url: "https://dev.applogger.cn/#key-indicators:aff87ff1cb9d27c6d4f65d4b7013afd4"
  - label: "鸿蒙"
    app_name: "保卫萝卜4（鸿蒙）"
    page_id: "c42a78f61784e4ad137a1a4876c153ef"
    trend_url: "https://dev.applogger.cn/#key-indicators:c42a78f61784e4ad137a1a4876c153ef"

trend_metrics:
  basic:
    - "新增用户"
    - "活跃用户"
    - "启动次数"
    - "安装用户"
    - "升级用户"
    - "次均时长"
    - "人均时长"
  revenue:
    - "收入"
    - "当天付费"
    - "新增付费"
    - "日活跃付费"

export_workflow:
  - "进入对应平台项目的趋势分析。"
  - "使用自定义日期选择目标起止自然日。"
  - "基本趋势和收入趋势均切换到右侧表格视图读取逐日数据。"
  - "三个平台统一使用安卓、iOS、鸿蒙标签。"
  - "输出汇总、安卓、iOS、鸿蒙四个展示页，并保留逐日明细页。"

aggregation_rules:
  additive_metrics:
    - "新增用户"
    - "活跃用户"
    - "启动次数"
    - "安装用户"
    - "升级用户"
    - "收入"
    - "当天付费"
    - "新增付费"
    - "日活跃付费"
  summary: "汇总值按日期对安卓、iOS、鸿蒙三端求和。"
  session_average: "次均时长统一换算为分钟；汇总次均时长 = 三端总启动时长 / 三端启动次数。"
  user_average: "人均时长统一换算为分钟；汇总人均时长 = 三端总用户时长 / 三端活跃用户。"

date_rules:
  - "日期范围不得超过页面允许的最新日期。"
  - "用户年份与页面可选年份冲突时，先按页面可选范围核对并明确披露实际执行年份。"

security:
  - "不保存账号、密码、登录 token 或导出的业务明细。"
  - "GitHub 仅记录项目定位、指标和汇总口径。"

page_analysis:
  confirmed_range:
    start_date: "2026-07-30"
    end_date: "2026-08-12"
  pages:
    - code: "scene_newcooperation_home"
      label: "活动页面"
    - code: "scene_newcooperation_level"
      label: "进入战斗"
    - code: "scene_daily"
      label: "周赛"
    - code: "scene_starway"
      label: "星途"
  daily_metrics:
    - "DAU（取对应平台趋势分析的活跃用户）"
    - "新增"
    - "活跃"
    - "启动次数"
  summary_formulas:
    DAU: "安卓 + iOS + 鸿蒙"
    new_users: "安卓 + iOS + 鸿蒙"
    active_users: "安卓 + iOS + 鸿蒙"
    starts: "安卓 + iOS + 鸿蒙"
    participation_rate: "汇总活跃 / 汇总DAU"
    starts_per_active_user: "汇总启动次数 / 汇总活跃"
  output_layout:
    vertical_sections: "活动页面、进入战斗、周赛、星途"
    horizontal_blocks: "汇总、安卓、iOS、鸿蒙"
    date_granularity: "自然日"
  extraction_rule:
    - "页面分析表在选择日期区间时返回区间汇总，不能直接作为逐日数据。"
    - "需要逐日结果时必须按每个自然日分别读取，再合并输出。"

  interval_summary:
    layout: "汇总、安卓、iOS、鸿蒙四个横向区块；行维度为活动页面、进入战斗、周赛、星途。"
    DAU: "日期区间内逐日DAU求和，不做区间去重。"
    new_users: "日期区间内逐日新增求和。"
    active_users: "日期区间内各页面逐日活跃求和，不做区间去重。"
    starts: "日期区间内逐日启动次数求和。"
    participation_rate: "区间活跃合计 / 区间DAU合计，不使用逐日参与率简单平均。"
    starts_per_active_user: "区间启动次数合计 / 区间活跃合计，不使用逐日人均次数简单平均。"

  cooperation_status_analysis:
    confirmed_range:
      start_date: "2026-07-30"
      end_date: "2026-08-12"
      inclusive_days: 14
    source:
      module: "页面分析"
      request_mode: "stage"
      reduce: 1
      page_name_pattern: "cooperation_level{难度}_{事件类型}_{事件状态}"
    parsing:
      level: "从 level 后的数字提取难度。"
      event_type: "提取难度与末尾状态之间的字符串；clear、event1001 等均保留原值。"
      status: "仅接受页面名末尾的 0、1、2。"
      exclude_event_type:
        - "hp"
    status_mapping:
      "0": "失败"
      "1": "通过"
      "2": "完美通关"
    aggregation:
      group_by:
        - "系统（安卓 / iOS / 鸿蒙）"
        - "难度"
        - "事件类型"
      base_metrics: "新增用户、活跃用户、启动次数均对状态0/1/2页面做区间合计。"
      failed_users: "状态0页面的活跃用户。"
      passed_users: "状态1页面的活跃用户。"
      perfect_users: "状态2页面的活跃用户。"
      failed_starts: "状态0页面的启动次数。"
      passed_starts: "状态1页面的启动次数。"
      perfect_starts: "状态2页面的启动次数。"
      total_starts: "状态0启动次数 + 状态1启动次数 + 状态2启动次数。"
      pass_starts: "状态1启动次数 + 状态2启动次数。"
      fail_rate: "状态0启动次数 / 总启动次数。"
      pass_rate: "(状态1启动次数 + 状态2启动次数) / 总启动次数。"
      perfect_rate: "状态2启动次数 / 总启动次数。"
    caveat: "状态活跃用户列仅作参考，不参与失败率、通关率、完美通关率计算；所有率统一按状态启动次数计算。"

balance_analysis:
  module: "产出与消耗"
  asset: "宝石"
  platform_scope:
    - "安卓"
    - "iOS"
    - "鸿蒙"
  periods:
    S1:
      start_date: "2026-02-12"
      end_date: "2026-02-25"
      inclusive_days: 14
    S2:
      start_date: "2026-07-30"
      end_date: "2026-08-12"
      inclusive_days: 14
  aggregation:
    quantity: "同一来源在安卓、iOS、鸿蒙三端数量求和。"
    share: "同季、同类别（产出或消耗）单项数量 / 该类别纳入项目数量合计。"
    comparison: "同时展示S1/S2数量、占比、S2-S1变化量及S2/S1-1变化率。"
  name_mapping:
    output:
      pve_ticket: "宝石/产出/合作挑战票"
