    - open_id
    - nb_open_id
  source_files:
  - uploaded_name: 5729ff37-7d55-4a0b-a619-eca618a417c6.xlsx
    local_sandbox_path: /mnt/data/5729ff37-7d55-4a0b-a619-eca618a417c6.xlsx
  updated_at: '2026-06-30'
  notes:
  - 本文件由用户上传的最新版《下方了》埋点方案 Excel 更新。
  - 下方了项目固定使用 ta.v_user_41 / ta.v_event_41；不要误用 v44，v44 为弯月勇者。
  - v41 create_role_time 为 timestamp 类型，SQL 中直接按时间字段处理，不需要 from_unixtime。
  - 外挂治理相关 sheet 的属性列与标准模板不同：属性名从第 5 列开始，已按该页实际结构解析。
  - 如 SQL 口径涉及首日付费，必须限定注册当天/active_days=0 的 pay_log，不得使用查询范围累计付费代替。
