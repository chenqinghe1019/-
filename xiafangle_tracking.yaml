      type: double
      source_sheet: 事件属性
    - name: node_id
      display_name: 节点序号
      type: double
      description: |-
        10.程序启动
        20开始加载
        30.结束加载
        40.注册创角
        50.登录
        60. 进入引导战斗
        99. 完成引导战斗（首次）
        101 首次进入大厅（首次）
      source_sheet: 事件属性
    - name: node_name
      display_name: 节点页面名称
      type: varchar
      description: |-
        Launch.程序启动
        BeginLoading 开始加载
        EndLoading .结束加载
        Register. 进入引导战斗
        Login.登录
        BeginGuideMap.注册创角
        EndGuideMap. 完成引导战斗（首次）
        EnterHome 首次进入大厅（首次）
