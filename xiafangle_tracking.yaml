  notes:
  - 本文件由用户上传的最新版《下方了》埋点方案 Excel 更新。
  - 下方了项目固定使用 ta.v_user_41 / ta.v_event_41；不要误用 v44，v44 为弯月勇者。
  - v41 create_role_time 为 timestamp 类型，SQL 中直接按时间字段处理，不需要 from_unixtime。
  - 如 SQL 口径涉及首日付费，必须限定注册当天/active_days=0 的 pay_log，不得使用查询范围累计付费代替。
  - pay_log.payment 事件属性单位为分，统计金额和首日付费分层前必须 /100 转为元。
  - in_out_log 当前属性为 change_reason、online_time；不要依赖 log_type 字段。登录/登出可按 change_reason 判断或仅按事件存在判断。
  - 流失状态与流失前在线时长统一从 in_out_log 获取；按玩家、自然日汇总 online_time，并按秒 /60 转为分钟。不要再用 ta_mg_hide 或 #duration 计算在线时长。
  - 流失判断以 in_out_log 的实际登录/登出记录为准；change_power_log 可能由服务端后台重算触发，不能单独作为玩家活跃依据。流失分析中的每日战力应仅展示当日存在 in_out_log 的活跃日，避免出现已判流失但后续仍展示后台战力变化的误解。
  - 后续滚服判断以当前角色为基准：同一 nb_open_id 下存在不同的 #account_id，且其 create_role_time 晚于当前角色时，标记“后续是否滚服=是”；仅有更早角色不算当前角色的后续滚服。
  - 英雄升星事件为 role_upstar_log，英雄字段 role_id，新星级字段 nstar；英雄获得事件为 role_obtain_log，初始星级字段 init_star。
  - 新人特惠前3档可按 pay_log.product_type=新人特惠 且 product_id in (1,2,3) 判断。
  - change_power_log.change_reason=5635 表示升星、5636 表示升阶；num 为本次战力变化量。
  - pay_log 中代币支付可能出现 payment=0；统计商品名义金额时关联 ta_dim.dim_41_0_vprop_sql_1429，关联键为 concat(product_type, cast(cast(product_id as bigint) as varchar), product_name)，金额取 #vp@product_concat@payment。
  - 主线关卡通关统计中，battle_result=2 或 battle_result=1 且 duration=0 视为跳关；跳关既单独计入跳关人数，也同时计入通关人数。
  - 主线完整通关率与跳关率按玩家、日期、关卡、battle_uid逐场统计；battle_star或battle_result任一存在即算挑战，不再只保留玩家当天最高map_id。正常通关为battle_result=1且duration为空或非0；跳关为battle_result=2或battle_result=1且duration=0；正常通关与跳关互斥，总通关包含二者。
